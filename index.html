<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨田记 · 水墨田园</title>
<style>
:root {
  --paper: #efe6d2;
  --paper-dark: #e2d6bc;
  --ink: #2a2a30;
  --ink-soft: #5a5a62;
  --red: #b9412f;
  --indigo: #3f5a70;
  --kai: "KaiTi", "STKaiti", "Kaiti SC", "AR PL UKai CN", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  --rough: 255px 18px 225px 18px / 18px 225px 18px 255px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); font-family: var(--kai); color: var(--ink); user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
button { font-family: var(--kai); color: var(--ink); cursor: pointer; }

.paper {
  background: linear-gradient(135deg, rgba(244, 236, 218, 0.94), rgba(232, 222, 198, 0.94));
  border: 2px solid var(--ink);
  border-radius: var(--rough);
  box-shadow: 2px 3px 0 rgba(42, 42, 48, 0.18);
}
.seal {
  background: var(--red); color: #f6ecd8; font-weight: bold; text-align: center;
  border-radius: 6px 9px 5px 10px; box-shadow: inset 0 0 0 2px rgba(246, 236, 216, 0.55), 0 0 0 1px var(--red);
}

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { position: absolute; }
#date { top: 18px; right: 20px; display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 12px; }
#d-season { width: 46px; height: 46px; line-height: 46px; font-size: 28px; }
#d-term { font-size: 19px; letter-spacing: 2px; }
#d-time { font-size: 16px; color: var(--ink-soft); margin-top: 2px; }
#d-weather { font-size: 22px; border-left: 1px solid var(--ink-soft); padding-left: 12px; }
#money { top: 96px; right: 20px; padding: 6px 16px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
#money b { font-size: 22px; }
.coin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #a8842c; background: transparent; box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 9px #a8842c; }

#stamina { right: 24px; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 15px; writing-mode: vertical-rl; }
#stamina .bar { width: 16px; height: 150px; border: 2px solid var(--ink); border-radius: 9px 7px 10px 6px; background: rgba(239, 230, 210, 0.8); position: relative; overflow: hidden; }
#stamina i { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: linear-gradient(to top, #2a2a30, #5f7f6a); transition: height 0.3s; }
#stamina.low i { background: linear-gradient(to top, #7a2a20, var(--red)); }

#hotbar { left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
.slot {
  width: 60px; height: 60px; position: relative; display: flex; align-items: center; justify-content: center;
  background: rgba(240, 232, 212, 0.9); border: 2px solid var(--ink-soft); border-radius: 12px 16px 11px 17px / 16px 11px 17px 12px; cursor: pointer;
}
.slot.sel { border: 3px solid var(--red); transform: translateY(-6px); background: #f6efdc; box-shadow: 0 5px 0 rgba(42, 42, 48, 0.2); }
.slot .key { position: absolute; top: 1px; left: 5px; font-size: 11px; color: var(--ink-soft); font-family: sans-serif; }
.slot .n { position: absolute; right: 4px; bottom: 1px; font-size: 14px; font-family: Georgia, serif; font-weight: bold; }
.icon {
  width: 40px; height: 40px; line-height: 37px; text-align: center; font-size: 25px; font-weight: bold; color: var(--c, var(--ink));
  border: 2.5px solid var(--c, var(--ink)); border-radius: 50% 46% 52% 44% / 46% 52% 44% 50%; background: rgba(255, 252, 240, 0.6);
}
.icon.seed { border-style: dashed; font-size: 20px; border-radius: 30% 50% 30% 50%; color: var(--ink); border-color: #a8842c; }
.icon.tool { border-radius: 8px 10px 7px 11px; }
.icon.fish { border-radius: 60% 40% 40% 60% / 50%; }
#held-name { left: 50%; bottom: 92px; transform: translateX(-50%); font-size: 17px; letter-spacing: 2px; text-shadow: 0 0 6px var(--paper), 0 0 6px var(--paper), 0 0 6px var(--paper); white-space: nowrap; }

#tile-info { left: 50%; bottom: 118px; transform: translateX(-50%); font-size: 15px; letter-spacing: 1px; padding: 2px 14px; white-space: nowrap; color: var(--ink); background: rgba(239, 230, 210, 0.85); border: 1.5px solid var(--ink-soft); border-radius: var(--rough); }
#tile-info:empty { display: none; }
#prompt { left: 50%; top: 72%; transform: translateX(-50%); padding: 6px 18px; font-size: 18px; background: rgba(239, 230, 210, 0.92); border: 2px solid var(--ink); border-radius: var(--rough); }
#prompt kbd { font-family: var(--kai); background: var(--ink); color: var(--paper); padding: 0 7px; border-radius: 4px; margin-right: 6px; }
#toasts { left: 50%; top: 20%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.toast { padding: 7px 22px; font-size: 18px; background: rgba(42, 42, 48, 0.86); color: var(--paper); border-radius: var(--rough); animation: toast 2.6s forwards; white-space: nowrap; }
.toast.goal { background: var(--red); font-size: 20px; }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
#floats { left: 50%; top: 50%; }
.float { position: absolute; transform: translateX(-50%); white-space: nowrap; font-size: 20px; font-weight: bold; color: var(--red); text-shadow: 0 0 5px var(--paper), 0 0 5px var(--paper); animation: floatup 1.3s forwards; }
@keyframes floatup { from { opacity: 1; top: 0; } to { opacity: 0; top: -70px; } }

#corner { left: 18px; top: 18px; display: flex; gap: 8px; pointer-events: auto; }
#corner button { width: 40px; height: 40px; font-size: 20px; background: rgba(239, 230, 210, 0.9); border: 2px solid var(--ink); border-radius: 50% 44% 52% 46%; }
#corner button:hover, .slot:hover { background: #fbf5e4; }
#corner button.off { color: #aaa; text-decoration: line-through; }

#fishing { left: 50%; top: 40%; width: 0; height: 0; }
#fishing .target, #fishing .ring { position: absolute; left: -45px; top: -45px; width: 90px; height: 90px; border-radius: 50%; }
#fishing .target { border: 7px solid rgba(185, 65, 47, 0.75); border-radius: 50% 46% 52% 47%; }
#fishing .ring { --s: 1; transform: scale(var(--s)); border: calc(4px / var(--s)) solid var(--ink); border-radius: 48% 52% 47% 50%; }
#fishing .fish-text { position: absolute; top: 150px; left: 0; transform: translateX(-50%); white-space: nowrap; padding: 5px 18px; font-size: 19px; background: rgba(239, 230, 210, 0.92); border: 2px solid var(--ink); border-radius: var(--rough); }

/* ---------- 面板 ---------- */
#panel { position: fixed; inset: 0; background: rgba(239, 230, 210, 0.45); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.sheet { width: min(860px, 94vw); max-height: 88vh; overflow: auto; padding: 22px 30px 26px; border-radius: 14px 18px 12px 20px; }
.sheet h2 { margin: 0 0 4px; font-size: 30px; letter-spacing: 8px; display: flex; align-items: center; gap: 14px; }
.sheet h2 .seal { font-size: 15px; padding: 3px 7px; letter-spacing: 1px; }
.sheet h3 { margin: 16px 0 8px; font-size: 19px; border-bottom: 1px solid var(--ink-soft); padding-bottom: 4px; letter-spacing: 3px; }
.sheet .close { position: sticky; float: right; top: 0; width: 36px; height: 36px; font-size: 20px; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper); }
.sheet p { font-size: 17px; line-height: 1.75; margin: 6px 0; }
.sheet .muted { color: var(--ink-soft); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(8, 60px); gap: 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.bag-cols { display: grid; grid-template-columns: auto 1fr; gap: 26px; }
.row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px dashed rgba(90, 90, 98, 0.35); font-size: 17px; }
.row .grow { flex: 1; min-width: 0; }
.row small { display: block; color: var(--ink-soft); font-size: 13px; }
.row .price { font-family: Georgia, serif; font-weight: bold; white-space: nowrap; }
.btn { padding: 3px 12px; font-size: 16px; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px 13px 9px 14px; white-space: nowrap; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: 0.35; pointer-events: none; }
.btn.on { background: var(--ink); color: var(--paper); }
.seg { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 17px; }
.seg input[type=range] { width: 220px; accent-color: var(--red); }
.row.done { opacity: 0.5; }
.btn.red { border-color: var(--red); color: var(--red); }
.btn.red:hover { background: var(--red); color: var(--paper); }
.detail { min-height: 96px; }
.detail b { font-size: 22px; }
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.goal { padding: 6px 10px; border: 1.5px dashed var(--ink-soft); border-radius: 8px; font-size: 15px; color: var(--ink-soft); }
.goal.done { border: 2px solid var(--red); color: var(--ink); }
.goal b { display: block; font-size: 18px; }
.goal.done b::after { content: " ✓"; color: var(--red); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 17px; align-items: center; }
.keys kbd { font-family: var(--kai); background: var(--ink); color: var(--paper); padding: 1px 9px; border-radius: 5px; text-align: center; }
.center { text-align: center; }
.actions { display: flex; justify-content: center; gap: 18px; margin-top: 18px; }
.actions .btn { font-size: 20px; padding: 6px 26px; }

/* ---------- 标题 ---------- */
#title { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(239, 230, 210, 0.2) 0%, rgba(239, 230, 210, 0.75) 75%); transition: opacity 0.9s; }
#title.out { opacity: 0; pointer-events: none; }
.title-card { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto auto auto; justify-items: center; align-items: center; column-gap: 18px; text-align: center; }
.title-card h1 { grid-column: 1; grid-row: 1; margin: 0; font-size: clamp(72px, 13vh, 150px); letter-spacing: 0.12em; font-weight: bold; color: var(--ink); text-shadow: 3px 3px 0 rgba(42, 42, 48, 0.12), 0 0 30px var(--paper), 0 0 30px var(--paper); }
.seal.big { grid-column: 2; grid-row: 1; align-self: end; margin-bottom: 26px; font-size: 24px; line-height: 1.15; padding: 8px 9px; }
.sub { grid-column: 1 / 3; font-size: 24px; letter-spacing: 10px; margin: 4px 0 30px; text-shadow: 0 0 10px var(--paper), 0 0 10px var(--paper); }
.title-btns { grid-column: 1 / 3; display: flex; gap: 22px; }
.brush { font-size: 26px; padding: 10px 34px; letter-spacing: 6px; background: var(--ink); color: var(--paper); border: none; border-radius: var(--rough); box-shadow: 3px 4px 0 rgba(42, 42, 48, 0.25); }
.brush:hover { background: var(--red); }
#btn-continue { background: var(--red); }
.hint { grid-column: 1 / 3; margin-top: 28px; font-size: 16px; color: var(--ink-soft); letter-spacing: 2px; text-shadow: 0 0 8px var(--paper), 0 0 8px var(--paper); }

#fade { position: fixed; inset: 0; background: #1e1e24; opacity: 0; pointer-events: none; transition: opacity 0.9s; display: flex; align-items: center; justify-content: center; }
#fade.on { opacity: 1; pointer-events: auto; }
#fade-text { color: var(--paper); text-align: center; font-size: 22px; line-height: 2; letter-spacing: 4px; }
#fade-text h2 { font-size: 54px; margin: 0 0 6px; letter-spacing: 14px; }
#fade-text .seal { display: inline-block; font-size: 26px; padding: 4px 10px; margin-bottom: 14px; }
#fade-text .muted { color: #a8a294; font-size: 16px; }
#err { position: fixed; left: 10px; bottom: 10px; color: var(--red); font: 13px monospace; white-space: pre-wrap; max-width: 80vw; pointer-events: none; }

@media (max-width: 760px) {
  .slot { width: 46px; height: 46px; } .icon { width: 32px; height: 32px; line-height: 29px; font-size: 19px; }
  .grid { grid-template-columns: repeat(6, 46px); } .cols, .bag-cols { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="date" class="paper">
    <div id="d-season" class="seal">春</div>
    <div class="date-text">
      <div id="d-term">立春 · 第一日</div>
      <div id="d-time">卯时 06:00</div>
    </div>
    <div id="d-weather">晴</div>
  </div>
  <div id="money" class="paper"><span class="coin"></span><b id="m-val">0</b> 文</div>
  <div id="stamina" title="体力"><div class="bar"><i id="st-fill"></i></div><span>体力</span></div>
  <div id="hotbar"></div>
  <div id="tile-info"></div>
  <div id="held-name"></div>
  <div id="prompt" class="hidden"></div>
  <div id="toasts"></div>
  <div id="floats"></div>
  <div id="corner">
    <button id="btn-bag" title="行囊 (Tab)">囊</button>
    <button id="btn-help" title="帮助 (H)">？</button>
    <button id="btn-mute" title="静音 (M)">乐</button>
    <button id="btn-set" title="设置">设</button>
  </div>
  <div id="fishing" class="hidden">
    <div class="target"></div>
    <div class="ring" id="fish-ring"></div>
    <div class="fish-text" id="fish-text"></div>
  </div>
</div>

<div id="panel" class="hidden"><div class="sheet paper" id="sheet"></div></div>

<div id="title">
  <div class="title-card">
    <h1>墨田记</h1>
    <div class="seal big">耕<br>读</div>
    <p class="sub">水墨田园 · 四时耕作</p>
    <div class="title-btns">
      <button id="btn-continue" class="brush hidden">续耕旧田</button>
      <button id="btn-new" class="brush">开垦新田</button>
    </div>
    <p class="hint">WASD 行走 · 鼠标点击劳作 · E 交互 · Tab 行囊 · H 帮助</p>
  </div>
</div>

<div id="fade"><div id="fade-text"></div></div>
<div id="err"></div>
