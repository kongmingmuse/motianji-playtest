<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#efe6d2">
<title>墨田记 · 水墨田园</title>
<style>
:root {
  --paper: #efe6d2;
  --paper-dark: #e2d6bc;
  --ink: #2a2a30;
  --ink-soft: #5a5a62;
  --red: #b9412f;
  --indigo: #3f5a70;
  --kai: "KaiTi", "STKaiti", "Kaiti SC", "AR PL UKai CN", "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  --brush: "Ma Shan Zheng", "KaiTi", "STKaiti", "Kaiti SC", "AR PL UKai CN", "Noto Serif SC", serif; /* 题字用毛笔体，联网时才有 */
  --rough: 255px 18px 225px 18px / 18px 225px 18px 255px;
  --slot: 60px;
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--paper); font-family: var(--kai); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hidden { display: none !important; }
button { font-family: var(--kai); color: var(--ink); cursor: pointer; }

.paper {
  background: linear-gradient(135deg, rgba(244, 236, 218, 0.94), rgba(232, 222, 198, 0.94));
  border: 2px solid var(--ink);
  border-radius: var(--rough);
  box-shadow: 2px 3px 0 rgba(42, 42, 48, 0.18);
}
.seal {
  background: var(--red); color: #f6ecd8; font-weight: bold; text-align: center;
  border-radius: 6px 9px 5px 10px; box-shadow: inset 0 0 0 2px rgba(246, 236, 216, 0.55), 0 0 0 1px var(--red);
}

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { position: absolute; }
#date { top: 18px; right: 20px; display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 12px; }
#d-season { width: 46px; height: 46px; line-height: 46px; font-size: 28px; }
#d-term { font-size: 19px; letter-spacing: 2px; }
#d-time { font-size: 16px; color: var(--ink-soft); margin-top: 2px; }
#d-weather { font-size: 22px; border-left: 1px solid var(--ink-soft); padding-left: 12px; }
#money { top: 96px; right: 20px; padding: 6px 16px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
#money b { font-size: 22px; }
.coin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #a8842c; background: transparent; box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 9px #a8842c; }

#stamina { right: 24px; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 15px; writing-mode: vertical-rl; }
#stamina .bar { width: 16px; height: 150px; border: 2px solid var(--ink); border-radius: 9px 7px 10px 6px; background: rgba(239, 230, 210, 0.8); position: relative; overflow: hidden; }
#stamina i { position: absolute; left: 0; right: 0; bottom: 0; height: var(--v, 100%); background: linear-gradient(to top, #2a2a30, #5f7f6a); transition: height 0.3s; }
#stamina.low i { background: linear-gradient(to top, #7a2a20, var(--red)); }

#hotbar { left: 50%; bottom: calc(18px + var(--sb)); transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
.slot {
  width: var(--slot); height: var(--slot); position: relative; display: flex; align-items: center; justify-content: center; flex: none;
  background: rgba(240, 232, 212, 0.9); border: 2px solid var(--ink-soft); border-radius: 12px 16px 11px 17px / 16px 11px 17px 12px; cursor: pointer;
}
.slot.sel { border: 3px solid var(--red); transform: translateY(-6px); background: #f6efdc; box-shadow: 0 5px 0 rgba(42, 42, 48, 0.2); }
.slot .key { position: absolute; top: 1px; left: 5px; font-size: 11px; color: var(--ink-soft); font-family: sans-serif; }
.slot .n { position: absolute; right: 4px; bottom: 1px; font-size: 14px; font-family: Georgia, serif; font-weight: bold; }
.icon {
  width: calc(var(--slot) * 0.67); height: calc(var(--slot) * 0.67); display: flex; align-items: center; justify-content: center; flex: none;
  font-size: calc(var(--slot) * 0.42); line-height: 1; font-weight: bold; color: var(--c, var(--ink));
  border: 2.5px solid var(--c, var(--ink)); border-radius: 50% 46% 52% 44% / 46% 52% 44% 50%; background: rgba(255, 252, 240, 0.6);
}
.icon.seed { border-style: dashed; font-size: calc(var(--slot) * 0.34); border-radius: 30% 50% 30% 50%; color: var(--ink); border-color: #a8842c; }
.icon.tool { border-radius: 8px 10px 7px 11px; }
.icon.fish { border-radius: 60% 40% 40% 60% / 50%; }
#held-name { left: 50%; bottom: calc(var(--slot) + 32px + var(--sb)); transform: translateX(-50%); font-size: 17px; letter-spacing: 2px; text-shadow: 0 0 6px var(--paper), 0 0 6px var(--paper), 0 0 6px var(--paper); white-space: nowrap; }

#tile-info { left: 50%; bottom: calc(var(--slot) + 58px + var(--sb)); transform: translateX(-50%); font-size: 15px; letter-spacing: 1px; padding: 2px 14px; white-space: nowrap; color: var(--ink); background: rgba(239, 230, 210, 0.85); border: 1.5px solid var(--ink-soft); border-radius: var(--rough); }
#tile-info:empty { display: none; }
#prompt { left: 50%; top: 72%; transform: translateX(-50%); padding: 6px 18px; font-size: 18px; background: rgba(239, 230, 210, 0.92); border: 2px solid var(--ink); border-radius: var(--rough); }
#prompt kbd { font-family: var(--kai); background: var(--ink); color: var(--paper); padding: 0 7px; border-radius: 4px; margin-right: 6px; }
#toasts { left: 50%; top: 20%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.toast { padding: 7px 22px; font-size: 18px; background: rgba(42, 42, 48, 0.86); color: var(--paper); border-radius: var(--rough); animation: toast 2.6s forwards; white-space: nowrap; }
.toast.goal { background: var(--red); font-size: 20px; }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
#floats { left: 50%; top: 50%; }
.float { position: absolute; transform: translateX(-50%); white-space: nowrap; font-size: 20px; font-weight: bold; color: var(--red); text-shadow: 0 0 5px var(--paper), 0 0 5px var(--paper); animation: floatup 1.3s forwards; }
@keyframes floatup { from { opacity: 1; top: 0; } to { opacity: 0; top: -70px; } }

#corner { left: 18px; top: 18px; display: flex; gap: 8px; pointer-events: auto; }
#corner button { width: 40px; height: 40px; font-size: 20px; background: rgba(239, 230, 210, 0.9); border: 2px solid var(--ink); border-radius: 50% 44% 52% 46%; }
#corner button:hover, .slot:hover { background: #fbf5e4; }
#corner button.off { color: #aaa; text-decoration: line-through; }

#fishing { left: 50%; top: 40%; width: 0; height: 0; }
#fishing .target, #fishing .ring { position: absolute; left: -45px; top: -45px; width: 90px; height: 90px; border-radius: 50%; }
#fishing .target { border: 7px solid rgba(185, 65, 47, 0.75); border-radius: 50% 46% 52% 47%; }
#fishing .ring { --s: 1; transform: scale(var(--s)); border: calc(4px / var(--s)) solid var(--ink); border-radius: 48% 52% 47% 50%; }
#fishing .fish-text { position: absolute; top: 150px; left: 0; transform: translateX(-50%); white-space: nowrap; padding: 5px 18px; font-size: 19px; background: rgba(239, 230, 210, 0.92); border: 2px solid var(--ink); border-radius: var(--rough); }

/* ---------- 面板 ---------- */
#panel { position: fixed; inset: 0; background: rgba(239, 230, 210, 0.45); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.sheet { width: min(860px, 94vw); max-height: 88vh; overflow: auto; padding: 22px 30px 26px; border-radius: 14px 18px 12px 20px; }
.sheet h2 { font-family: var(--brush); margin: 0 0 4px; font-size: 30px; letter-spacing: 8px; display: flex; align-items: center; gap: 14px; }
.sheet h2 .seal { font-size: 15px; padding: 3px 7px; letter-spacing: 1px; }
.sheet h3 { margin: 16px 0 8px; font-size: 19px; border-bottom: 1px solid var(--ink-soft); padding-bottom: 4px; letter-spacing: 3px; }
.sheet .close { position: sticky; float: right; top: 0; width: 36px; height: 36px; font-size: 20px; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper); }
.sheet p { font-size: 17px; line-height: 1.75; margin: 6px 0; }
.sheet .muted { color: var(--ink-soft); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(8, var(--slot)); gap: 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.bag-cols { display: grid; grid-template-columns: auto 1fr; gap: 26px; }
.row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px dashed rgba(90, 90, 98, 0.35); font-size: 17px; }
.row .grow { flex: 1; min-width: 0; }
.row small { display: block; color: var(--ink-soft); font-size: 13px; }
.row .price { font-family: Georgia, serif; font-weight: bold; white-space: nowrap; }
.btn { padding: 3px 12px; font-size: 16px; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px 13px 9px 14px; white-space: nowrap; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: 0.35; pointer-events: none; }
.btn.on { background: var(--ink); color: var(--paper); }
.seg { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 17px; }
.seg input[type=range] { width: 220px; accent-color: var(--red); }
.row.done { opacity: 0.5; }
.btn.red { border-color: var(--red); color: var(--red); }
.btn.red:hover { background: var(--red); color: var(--paper); }
.detail { min-height: 96px; }
.detail b { font-size: 22px; }
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.goal { padding: 6px 10px; border: 1.5px dashed var(--ink-soft); border-radius: 8px; font-size: 15px; color: var(--ink-soft); }
.goal.done { border: 2px solid var(--red); color: var(--ink); }
.goal b { display: block; font-size: 18px; }
.goal.done b::after { content: " ✓"; color: var(--red); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 17px; align-items: center; }
.keys kbd { font-family: var(--kai); background: var(--ink); color: var(--paper); padding: 1px 9px; border-radius: 5px; text-align: center; }
.center { text-align: center; }
.actions { display: flex; justify-content: center; gap: 18px; margin-top: 18px; }
.actions .btn { font-size: 20px; padding: 6px 26px; }

/* ---------- 标题 ---------- */
#title { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(239, 230, 210, 0.2) 0%, rgba(239, 230, 210, 0.75) 75%); transition: opacity 0.9s; }
#title.out { opacity: 0; pointer-events: none; }
.title-card { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto auto auto; justify-items: center; align-items: center; column-gap: 18px; text-align: center; }
.title-card h1 { grid-column: 1; grid-row: 1; margin: 0; white-space: nowrap; font-family: var(--brush); font-size: clamp(48px, min(13vh, 20vw), 150px); letter-spacing: 0.12em; font-weight: bold; color: var(--ink); text-shadow: 3px 3px 0 rgba(42, 42, 48, 0.12), 0 0 30px var(--paper), 0 0 30px var(--paper); }
.seal.big { grid-column: 2; grid-row: 1; align-self: end; margin-bottom: 26px; font-size: 24px; line-height: 1.15; padding: 8px 9px; }
.sub { grid-column: 1 / 3; font-size: 24px; letter-spacing: 10px; margin: 4px 0 30px; text-shadow: 0 0 10px var(--paper), 0 0 10px var(--paper); }
.title-btns { grid-column: 1 / 3; display: flex; gap: 16px 22px; flex-wrap: wrap; justify-content: center; }
.brush { font-size: 26px; padding: 10px 34px; letter-spacing: 6px; background: var(--ink); color: var(--paper); border: none; border-radius: var(--rough); box-shadow: 3px 4px 0 rgba(42, 42, 48, 0.25); }
.brush:hover { background: var(--red); }
#btn-continue { background: var(--red); }
.hint { grid-column: 1 / 3; margin-top: 28px; font-size: 16px; color: var(--ink-soft); letter-spacing: 2px; text-shadow: 0 0 8px var(--paper), 0 0 8px var(--paper); }

#fade { position: fixed; inset: 0; background: #1e1e24; opacity: 0; pointer-events: none; transition: opacity 0.9s; display: flex; align-items: center; justify-content: center; }
#fade.on { opacity: 1; pointer-events: auto; }
#fade-text { color: var(--paper); text-align: center; font-size: 22px; line-height: 2; letter-spacing: 4px; }
#fade-text h2 { font-family: var(--brush); font-size: 54px; margin: 0 0 6px; letter-spacing: 14px; }
#fade-text .seal { display: inline-block; font-size: 26px; padding: 4px 10px; margin-bottom: 14px; }
#fade-text .muted { color: #a8a294; font-size: 16px; }
#err { position: fixed; left: 10px; bottom: 10px; color: var(--red); font: 13px monospace; white-space: pre-wrap; max-width: 80vw; pointer-events: none; }

/* ---------- 指引、画卷、农谚 ---------- */
#guide { left: 18px; top: 70px; max-width: 250px; padding: 6px 12px 7px; font-size: 15px; line-height: 1.4; border-width: 1.5px; }
#guide b { display: block; font-size: 12px; color: var(--red); letter-spacing: 1px; }
body.touch #guide { left: calc(12px + var(--sl)); top: 60px; max-width: 200px; font-size: 13px; }
.scroll4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 10px; }
.hang { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 8px 10px; border: 2px solid var(--ink-soft); background: rgba(255, 252, 240, 0.5); border-radius: 4px 6px 3px 7px; text-align: center; font-size: 14px; }
.hang.done { border-color: var(--red); }
.hang canvas { width: 100%; height: auto; border: 1px solid rgba(90, 90, 98, 0.4); }
.hang b { font-size: 17px; display: flex; align-items: center; gap: 4px; }
.hang .seal { font-size: 14px; padding: 1px 4px; }
.hang .need { --slot: 34px; display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; opacity: 0.6; line-height: 1.2; }
.hang .need.ok { opacity: 1; }
.hang .btn { font-size: 14px; white-space: normal; margin-top: 2px; }
.saying { font-size: 20px; color: #e8dcc0; margin: 4px 0; }
body.en .saying { font-style: italic; font-size: 18px; }

/* ---------- 地图与存档码 ---------- */
#mapcv { display: block; width: auto; height: auto; max-width: 100%; max-height: 62vh; margin: 8px auto 0; border: 2px solid var(--ink-soft); border-radius: 4px 7px 3px 6px; margin-top: 8px; }
#savecode { width: 100%; font: 12px/1.4 monospace; padding: 6px 8px; margin: 4px 0 8px; background: rgba(255, 252, 240, 0.7); border: 1.5px solid var(--ink-soft); border-radius: 6px; resize: vertical; user-select: text; -webkit-user-select: text; }

/* ---------- 账本、留影、帧率 ---------- */
.ledger { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 4px 0 0; }
.lbar { flex: 1; min-width: 0; max-width: 64px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; font-size: 12px; font-family: Georgia, serif; }
.lbar i { display: block; width: 70%; min-height: 2px; background: linear-gradient(to top, #2a2a30, #5f7f6a); border-radius: 3px 4px 0 0; }
.lbar small { font-family: var(--kai); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.photo { display: block; max-width: 100%; max-height: 58vh; margin: 8px auto 0; border: 6px solid #f6efdc; outline: 2px solid var(--ink-soft); box-shadow: 3px 4px 0 rgba(42, 42, 48, 0.2); -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; }
a.btn { text-decoration: none; color: var(--ink); display: inline-block; }
#fps { left: 18px; bottom: 14px; font: 12px/1 monospace; color: var(--ink-soft); background: rgba(239, 230, 210, 0.75); padding: 3px 7px; border-radius: 4px; }
body.touch #fps { left: 50%; bottom: auto; top: 2px; transform: translateX(-50%); }

/* ---------- 图鉴与语言 ---------- */
.almanac { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px 6px; }
.entry { --slot: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; line-height: 1.2; text-align: center; }
.entry.unseen { opacity: 0.32; }
#btn-lang { grid-column: 1 / 3; margin-top: 16px; font-size: 15px; padding: 4px 16px; background: rgba(239, 230, 210, 0.85); }

/* 英文：拉丁字母用衬线体（汉字图标仍回落到楷体），并收紧为汉字设计的字距 */
body.en { --kai: Georgia, "Iowan Old Style", "Palatino Linotype", "Noto Serif", "KaiTi", "STKaiti", "Kaiti SC", "AR PL UKai CN", "Noto Serif SC", serif; }
body.en #d-term { letter-spacing: 0; font-size: 17px; }
body.en #d-weather { font-size: 17px; }
body.en #held-name, body.en .hint, body.en #tile-info { letter-spacing: 0.3px; }
body.en .sheet h2 { font-family: var(--kai); font-style: italic; letter-spacing: 0.5px; font-size: 28px; }
body.en .sheet h2 .seal { font-style: normal; letter-spacing: 0; }
body.en .sheet h3 { letter-spacing: 0.5px; }
body.en .sheet p, body.en .row, body.en .keys { font-size: 16px; line-height: 1.55; }
body.en .sub { letter-spacing: 1.5px; font-size: 21px; font-style: italic; }
body.en .brush { letter-spacing: 1px; font-size: 23px; }
body.en #fade-text { letter-spacing: 0.5px; line-height: 1.8; }
body.en #fade-text h2 { font-family: var(--kai); font-style: italic; letter-spacing: 1px; font-size: 44px; }
body.en #corner button { width: auto; min-width: 40px; padding: 0 13px; font-size: 15px; border-radius: 20px 17px 21px 18px; }
body.en #stamina { font-size: 13px; }
body.en.touch #btn-act { font-size: 24px; font-style: italic; }
body.en.touch #d-term { font-size: 13px; }
body.en.touch #d-weather { font-size: 14px; }
body.en.touch #corner { align-items: flex-start; }
body.en.touch #corner button { font-size: 13px; padding: 0 10px; height: 36px; }
body.en.touch .sub { font-size: 17px; }
body.en.touch .sheet h2 { letter-spacing: 0.5px; font-size: 22px; }

/* ---------- 触屏与小屏 ---------- */
#joy, #btn-act { display: none; }
.hint .mobile { display: none; }
#prompt { pointer-events: auto; cursor: pointer; }

body.touch { --slot: clamp(34px, calc((100vw - 51px) / 8), 54px); }
body.touch .hint .pc, body.touch #prompt kbd, body.touch .slot .key { display: none; }
body.touch .hint .mobile { display: inline; }
body.touch #hotbar { gap: 5px; bottom: calc(8px + var(--sb)); }
body.touch #joy {
  display: block; left: calc(18px + var(--sl)); bottom: calc(var(--slot) + 46px + var(--sb)); width: 128px; height: 128px; border-radius: 50%;
  border: 2px solid rgba(42, 42, 48, 0.5); background: rgba(239, 230, 210, 0.35); pointer-events: auto; touch-action: none;
}
#joy-knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(42, 42, 48, 0.55); border: 2px solid var(--paper); }
body.touch #btn-act {
  display: block; right: calc(22px + var(--sr)); bottom: calc(var(--slot) + 56px + var(--sb)); width: 92px; height: 92px; font-size: 36px; font-weight: bold;
  color: var(--paper); background: rgba(185, 65, 47, 0.82); border: 3px solid var(--paper); border-radius: 50% 46% 52% 47%; box-shadow: 0 0 0 2px var(--red);
  pointer-events: auto; touch-action: none;
}
body.touch #btn-act.down { background: var(--ink); transform: scale(0.94); }
body.touch #prompt { top: auto; bottom: calc(var(--slot) + 92px + var(--sb)); padding: 9px 24px; font-size: 19px; background: var(--ink); color: var(--paper); border-color: var(--paper); box-shadow: 0 0 0 2px var(--ink); }
body.touch #corner { left: calc(12px + var(--sl)); top: 12px; }
body.touch #date { top: 12px; right: calc(12px + var(--sr)); padding: 6px 12px 6px 8px; gap: 8px; }
body.touch #d-season { width: 36px; height: 36px; line-height: 36px; font-size: 22px; }
body.touch #d-term { font-size: 15px; letter-spacing: 1px; }
body.touch #d-time { font-size: 13px; }
body.touch #d-weather { font-size: 18px; padding-left: 8px; }
body.touch #money { top: 66px; right: calc(12px + var(--sr)); padding: 3px 12px; font-size: 15px; }
body.touch #money b { font-size: 18px; }
/* 体力条改为横条，放在钱数下方，给右下的劳作键让位 */
body.touch #stamina { right: calc(12px + var(--sr)); top: 104px; bottom: auto; flex-direction: row; writing-mode: horizontal-tb; font-size: 13px; }
body.touch #stamina .bar { width: 96px; height: 12px; }
body.touch #stamina i { top: 0; right: auto; height: 100%; width: var(--v, 100%); transition: width 0.3s; }
body.touch #toasts { top: 150px; }
body.touch .toast { font-size: 16px; white-space: normal; text-align: center; max-width: 86vw; }
body.touch .sheet { padding: 16px 16px 20px; max-height: 92vh; }
body.touch .sheet h2 { font-size: 24px; letter-spacing: 5px; }
body.touch .btn { padding: 6px 13px; }
body.touch .row { flex-wrap: wrap; justify-content: flex-end; }
body.touch .row .grow { min-width: 6em; }
body.touch #fishing { top: 34%; }
body.touch #fishing .fish-text { top: 110px; font-size: 16px; }

/* 手机横屏：摇杆与劳作键落到底边，快捷栏夹在中间 */
@media (orientation: landscape) {
  body.touch { --slot: clamp(32px, calc((100vw - 350px - var(--sl) - var(--sr)) / 8.7), 54px); }
  body.touch #joy { bottom: calc(14px + var(--sb)); width: 118px; height: 118px; }
  body.touch #btn-act { bottom: calc(18px + var(--sb)); }
  body.touch #prompt { bottom: calc(var(--slot) + 62px + var(--sb)); }
  body.touch .title-card h1 { font-size: clamp(54px, 22vh, 120px); }
  body.touch .sub { margin-bottom: 14px; font-size: 19px; }
  body.touch .hint { margin-top: 12px; }
  body.touch .seal.big { font-size: 18px; margin-bottom: 14px; }
}
/* 竖屏：左上按钮竖排，免得与日期牌相撞 */
@media (orientation: portrait) {
  body.touch #corner { flex-direction: column; }
  body.touch #guide { top: 254px; }
  /* 竖屏时提示条挪到摇杆上方，免得被摇杆和劳作键夹住 */
  body.touch #prompt { bottom: calc(var(--slot) + 196px + var(--sb)); max-width: 88vw; text-align: center; }
  .scroll4 { grid-template-columns: repeat(2, 1fr); }
  body.touch .title-card { max-width: 94vw; }
  body.touch .sub { font-size: 19px; letter-spacing: 6px; }
  body.touch .hint { font-size: 14px; line-height: 1.7; }
}

@media (max-width: 760px) {
  :root { --slot: 46px; }
  .grid { grid-template-columns: repeat(6, var(--slot)); gap: 6px; } .cols, .bag-cols { grid-template-columns: 1fr; gap: 10px; }
  .goals { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}

/* 交情与赠礼 */
.bond { border: 1px solid rgba(42, 42, 48, 0.18); border-radius: 6px 9px 7px 10px; padding: 8px 12px 10px; margin: 6px 0 10px; background: rgba(255, 255, 255, 0.22); }
.bond p { margin: 4px 0; }
.bond-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 5px; }
.pips i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--red); display: block; }
.pips i.on { background: var(--red); }
.loves { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; --slot: 40px; }
.love { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.love small { font-size: 12px; }
.love.unk { opacity: 0.4; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; --slot: 46px; }
.slot.pick { cursor: pointer; font: inherit; color: inherit; padding: 0; }
.slot.pick:hover { border-color: var(--red); }
.icon.brew { border-radius: 30% 30% 46% 46% / 22% 22% 60% 60%; }
.trend { color: var(--red); font-weight: normal; white-space: nowrap; }
.price .up { color: var(--red); margin-right: 3px; }
.icon.fruit { border-radius: 50% 50% 46% 46% / 42% 42% 58% 58%; }
.yearend { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(42, 42, 48, 0.25); }
.yearend b { display: block; color: var(--red); margin-bottom: 4px; }
.tabs { margin: 4px 0 6px; flex-wrap: wrap; }
#guide.chores div { font-size: 0.93em; }

</style>

        <h3>${y("\u5B58\u6863","Save")}</h3><div class="seg"><button class="btn" data-act="savenow">${y("\u7ACB\u5373\u5B58\u6863","Save now")}</button><span class="muted">${y("\u6BCF\u65E5\u6E05\u6668\u3001\u4EE5\u53CA\u5207\u5230\u540E\u53F0\u65F6\u90FD\u4F1A\u81EA\u52A8\u5B58\u6863\uFF1B\u8BFB\u6863\u540E\u4ECE\u5C4B\u524D\u5F00\u59CB\u3002","The game also saves every morning and whenever you leave the page. Loading puts you back at your door.")}</span></div>`}else if(this.open==="help"){let r=(o,c,l)=>`<kbd>${o}</kbd><span>${y(c,l)}</span>`,a=document.body.classList.contains("touch")?`<h3>${y("\u89E6\u5C4F\u64CD\u4F5C","Touch controls")}</h3><div class="keys">

        <div class="keys">

        <h3>${y("\u56DB\u65F6","The Seasons")}</h3>
        <p>${y("\u4E00\u5E74\u4E8C\u5341\u56DB\u8282\u6C14\uFF0C\u6BCF\u8282\u6C14\u4E24\u65E5\uFF0C\u4E00\u5B63\u5341\u4E8C\u65E5\u3002\u4F5C\u7269\u987B\u5728\u5F53\u5B63\u64AD\u79CD\uFF0C\u6BCF\u65E5\u6D47\u6C34\u65B9\u80FD\u751F\u957F\uFF1B\u6362\u5B63\u65F6\u4E0D\u5408\u65F6\u4EE4\u7684\u4F5C\u7269\u4F1A\u67AF\u840E\u3002\u96E8\u96EA\u4E4B\u65E5\u4E0D\u5FC5\u6D47\u6C34\u3002","A year has 24 solar terms of two days each, so a season lasts 12 days. Sow crops in their season and water them every day. Crops out of season wither when the season turns. Rain and snow do the watering for you.")}</p>
        <h3>${y("\u751F\u8BA1","Making a Living")}</h3>
        <p>${y("\u7530\u897F\u6709\u8D27\u90CE\uFF0C\u53EF\u4E70\u79CD\u5B50\u3001\u5356\u6536\u6210\u3002\u6C34\u58F6\u53EF\u5728\u6C60\u5858\u8FB9\u6C72\u6C34\uFF1B\u624B\u6301\u9493\u7AFF\u70B9\u51FB\u6C60\u9762\u5373\u53EF\u5782\u9493\uFF0C\u9C7C\u54AC\u94A9\u540E\u5728\u58A8\u5708\u4E0E\u6731\u5708\u91CD\u5408\u65F6\u70B9\u51FB\u3002\u65A7\u5934\u53EF\u4F10\u8FD1\u5904\u7684\u6811\u53D6\u67F4\uFF0C\u6570\u65E5\u540E\u6811\u4F1A\u91CD\u65B0\u957F\u6210\u3002","The peddler west of the field sells seeds and buys your goods. Refill the watering can at the pond. With the rod in hand, click the water to fish; when a fish bites, click as the ink ring meets the red ring. The axe fells nearby trees for firewood, and they grow back in a few days.")}</p>
        <p>${y("\u5C4B\u4E1C\u6709\u544A\u793A\u724C\uFF0C\u4E61\u90BB\u6C42\u8D2D\u7684\u8D4F\u94B1\u66F4\u9AD8\u3002\u5C4B\u897F\u662F\u9E21\u820D\uFF0C\u5411\u8D27\u90CE\u4E70\u6765\u5C0F\u9E21\u540E\u6BCF\u65E5\u6E05\u6668\u53EF\u62FE\u86CB\u3002\u7530\u91CE\u95F4\u6BCF\u65E5\u6563\u843D\u7740\u5F53\u5B63\u91CE\u7269\uFF0C\u8D70\u8FD1\u5373\u53EF\u62FE\u53D6\u3002","The notice board east of the house lists requests that pay more. The coop is to the west: buy chicks from the peddler and collect eggs each morning. Seasonal wild finds appear around the land every day.")}</p>
        <p>${y("\u884C\u56CA\u91CC\u53EF\u4EE5\u5236\u4F5C\u4E0E\u70F9\u996A\uFF1A\u6728\u67F4\u505A\u7AF9\u6E20\uFF08\u6BCF\u6668\u81EA\u52A8\u6D47\u704C\u56DB\u90BB\u7684\u7530\u683C\uFF09\uFF0C\u9C7C\u505A\u80A5\u6599\uFF08\u4E0B\u4E00\u6B21\u6536\u83B7\u7FFB\u500D\uFF09\uFF0C\u8FD8\u80FD\u505A\u9C7C\u6C64\u3001\u8336\u53F6\u86CB\u3001\u7530\u56ED\u70E9\uFF0C\u6BD4\u751F\u5403\u66F4\u9876\u997F\u4E5F\u66F4\u503C\u94B1\u3002\u8D27\u90CE\u8FD8\u5356\u5927\u6C34\u58F6\u4E0E\u6ECB\u8865\u6C64\u3002","Craft and cook from your bag: firewood makes bamboo channels (they water the four plots beside them every morning), fish makes fertilizer (doubles the next harvest), and you can cook fish soup, tea eggs and garden stew, which restore more stamina and sell for more. The peddler also sells a larger can and tonic.")}</p>
        <p>${y("\u4EAD\u897F\u7684\u753B\u5E08\u5728\u753B\u4E00\u5377\u56DB\u65F6\u5C71\u6C34\uFF0C\u6BCF\u5B63\u8981\u4E09\u6837\u5F53\u5B63\u98CE\u7269\uFF1B\u56DB\u5E45\u753B\u6210\u540E\u8D27\u90CE\u7684\u6536\u8D2D\u4EF7\u6C38\u4E45\u4E0A\u6DA8\u4E00\u6210\u3002\u6C60\u897F\u7684\u6E14\u7FC1\u5356\u9C7C\u9975\uFF0C\u5E26\u5728\u8EAB\u4E0A\u629B\u7AFF\uFF0C\u9C7C\u54AC\u94A9\u66F4\u5FEB\u3001\u597D\u9C7C\u66F4\u591A\u3002","The painter west of the pavilion is working on a scroll of the four seasons and needs three seasonal things for each panel. Finish all four and the peddler pays 10% more for good. The fisherman on the west bank sells bait: carry it when you cast and fish bite sooner, with better ones more often.")}</p>
        <p>${y("\u8D27\u90CE\u5904\u8FD8\u80FD\u201C\u8425\u9020\u201D\u5BB6\u4E1A\uFF1A\u6C34\u4E95\uFF08\u5728\u7530\u8FB9\u6C72\u6C34\uFF09\u3001\u77F3\u706F\u3001\u82B1\u5703\u3001\u5927\u884C\u56CA\u3001\u6269\u5EFA\u9E21\u820D\u3001\u9171\u7F38\uFF0C\u5EFA\u6210\u540E\u573A\u666F\u91CC\u770B\u5F97\u89C1\u3002\u9171\u7F38\u6446\u5728\u5C4B\u4E1C\uFF0C\u4F5C\u7269\u5165\u7F38\u4E24\u65E5\u6210\u9171\u83DC\uFF0C\u7A3B\u3001\u7C9F\u3001\u83CA\u56DB\u65E5\u6210\u9152\uFF0C\u6BD4\u9C9C\u8D27\u503C\u94B1\u3002","The peddler also arranges improvements: a well beside the field, stone lanterns, flower beds, a bigger bag, a coop extension and pickling jars. You can see them on your land once built. The jars stand east of the house: crops become pickles in two days, and rice, millet and chrysanthemum become wine in four, all worth more than fresh.")}</p>
        <p>${y("\u8D27\u90CE\u8FD8\u5356\u7CBE\u94C1\u9504\u4E0E\u83B2\u84EC\u58F6\u5634\uFF1A\u4E70\u4E0B\u540E\u4E00\u9504\u5F00\u4E09\u683C\u3001\u4E00\u6B21\u6D47\u4E09\u683C\uFF08\u4E0E\u4F60\u671D\u5411\u5782\u76F4\u7684\u5DE6\u53F3\u4E24\u683C\uFF09\u3002\u679C\u82D7\u683D\u5728\u5C4B\u4E1C\u5317\u7684\u679C\u56ED\uFF0C\u6700\u591A\u516D\u68F5\uFF1A\u6787\u6777\u6625\u3001\u6843\u5B50\u590F\u3001\u67FF\u5B50\u79CB\u3001\u871C\u6A58\u51AC\uFF0C\u516B\u65E5\u957F\u6210\u540E\u6BCF\u5230\u5F53\u5B63\u6BCF\u6668\u7ED3\u4E00\u679C\uFF0C\u8D70\u8FD1\u5373\u53EF\u6458\u3002\u7EA6\u534A\u6570\u65E5\u5B50\u6709\u201C\u884C\u60C5\u201D\uFF0C\u67D0\u4E00\u7C7B\u8D27\u7269\u5F53\u65E5\u591A\u5356\u4E24\u6210\uFF1B\u5C31\u5BDD\u524D\u80FD\u542C\u5230\u660E\u65E5\u7684\u884C\u60C5\u3002","The peddler also sells an iron hoe and a rose spout: with them you till and water three plots at once (the plot you aim at and the two beside it). Saplings go in the orchard northeast of the house, up to six trees: loquat in spring, peach in summer, persimmon in autumn, mandarin in winter. They grow in eight days, then bear one fruit each morning in their season; walk up to pick. On about half the days one kind of goods sells for 20% more, and at bedtime you hear what tomorrow\u2019s market favors.")}</p>
        <p>${y("\u8D27\u90CE\u8FD8\u5356\u6C34\u725B\uFF0C\u517B\u5728\u6C60\u5357\u8349\u5730\uFF1A\u6709\u725B\u76F8\u52A9\uFF0C\u9504\u5730\u4E0D\u8D39\u4F53\u529B\uFF1B\u6BCF\u65E5\u6E05\u6668\u79EF\u4E00\u4EFD\u80A5\u6599\uFF08\u6700\u591A\u6512\u4E09\u4EFD\uFF09\uFF0C\u8D70\u8FD1\u5373\u53EF\u6536\u3002\u6BCF\u8FC7\u5B8C\u4E00\u5E74\uFF0C\u65B0\u5E74\u6E05\u6668\u4F1A\u6709\u4E00\u4EFD\u201C\u5C81\u672B\u5C0F\u7ED3\u201D\uFF0C\u6309\u4E00\u5E74\u8FDB\u8D26\u8BC4\u4E2A\u540D\u5934\uFF0C\u4E5F\u8BB0\u5728\u884C\u56CA\u7684\u8D26\u672C\u91CC\u3002","The peddler also sells a water buffalo, which grazes south of the pond: with its help the hoe costs no stamina, and each morning it leaves one fertilizer (up to three wait for you) to collect. After each full year, New Year\u2019s morning brings a review of the year with a title based on your earnings; it is kept in the ledger in your bag.")}</p>
        <p>${y("\u8425\u9020\u91CC\u7684\u8702\u7BB1\u7F6E\u5728\u679C\u56ED\u897F\u4FA7\uFF1A\u6625\u590F\u79CB\u6BCF\u4E2A\u6674\u65E5\u5F97\u871C\u4E00\u7F50\uFF0C\u7530\u91CC\u7684\u6CB9\u83DC\u82B1\u4E0E\u79CB\u83CA\u3001\u82B1\u5703\u3001\u6625\u5929\u7684\u6843\u82B1\u90FD\u80FD\u6DFB\u871C\uFF0C\u4E00\u65E5\u81F3\u591A\u4E09\u7F50\uFF0C\u96E8\u5929\u548C\u51AC\u5929\u65E0\u871C\u3002\u8702\u871C\u53EF\u5403\u53EF\u5356\uFF0C\u914D\u9C9C\u679C\u8FD8\u80FD\u505A\u871C\u996F\u3002\u65B0\u624B\u6307\u5F15\u505A\u5B8C\u540E\uFF0C\u5C4F\u5E55\u4E00\u89D2\u4F1A\u5217\u51FA\u201C\u519C\u4E8B\u201D\uFF1A\u7530\u91CC\u53EF\u6536\u4E0E\u672A\u6D47\u6C34\u7684\u683C\u6570\u3001\u53EF\u53D6\u7684\u9E21\u86CB\u679C\u5B50\u7B49\u3001\u53EF\u4EA4\u4ED8\u7684\u544A\u793A\uFF1B\u53EF\u5728\u8BBE\u7F6E\u91CC\u5173\u6389\u3002","The beehives stand west of the orchard: one jar of honey for every fair day from spring to autumn, more when rapeseed or chrysanthemum bloom in the field, with flower beds, or with peach blossom in spring, up to three a day; none in rain or winter. Eat it, sell it, or candy fresh fruit with it. Once the guide is finished, a to-do list in the corner shows crops to harvest or water, things to collect, and notices you can deliver. You can turn it off in Options.")}</p>
        <p>${y("\u8282\u65E5\u5165\u591C\uFF08\u9149\u65F6\uFF09\u540E\u5230\u6C60\u8FB9\u7684\u4EAD\u5B50\u91CC\u53EF\u4EE5\u653E\u4E00\u76CF\u5929\u706F\u8BB8\u613F\uFF0C\u4E09\u9009\u4E00\uFF1A\u4F5C\u7269\u4ECA\u591C\u591A\u957F\u4E00\u65E5\u3001\u660E\u65E5\u5356\u4EC0\u4E48\u90FD\u591A\u4E24\u6210\u3001\u4F53\u529B\u4E0A\u9650 +5\u3002\u6C60\u91CC\u6709\u4E9B\u9C7C\u8981\u770B\u5929\u65F6\uFF1A\u91D1\u9CA4\u53EA\u5728\u96E8\u5929\u4E0A\u94A9\uFF0C\u9CD7\u9C7C\u53EA\u5728\u5165\u591C\u540E\u4E0A\u94A9\u3002","After dusk (6 p.m.) on a festival, go to the pavilion by the pond to release a sky lantern and make one of three wishes: crops grow an extra day tonight, everything sells for 20% more tomorrow, or max stamina +5. Some fish depend on the hour and the weather: golden carp bite only in the rain, eels only after dark.")}</p>
        <h3>${y("\u4EBA\u60C5","Friendship")}</h3>
        <p>${y("\u8D27\u90CE\u3001\u753B\u5E08\u3001\u6E14\u7FC1\u6BCF\u65E5\u5404\u53EF\u6536\u4F60\u4E00\u4EFD\u793C\uFF1A\u4F5C\u7269\u3001\u9C7C\u3001\u91CE\u7269\u3001\u9E21\u86CB\u3001\u83DC\u80B4\u3001\u814C\u917F\u90FD\u884C\u3002\u6BCF\u4EBA\u5404\u6709\u4E09\u6837\u6700\u7231\uFF0C\u9001\u5BF9\u4E86\u4EA4\u60C5\u6DA8\u5F97\u5FEB\uFF1B\u4EA4\u60C5\u6BCF\u6DF1\u4E00\u7EA7\uFF0C\u5BF9\u65B9\u4F1A\u900F\u9732\u4E00\u6837\u6700\u7231\u3002\u8282\u65E5\u9001\u793C\u60C5\u5206\u52A0\u500D\u3002\u4EA4\u60C5\u5171\u56DB\u7EA7\uFF1A\u8D27\u90CE\u7684\u79CD\u5B50\u6BCF\u7EA7\u4FBF\u5B9C 5%\uFF0C\u753B\u5E08\u8BA9\u544A\u793A\u8D4F\u94B1\u6BCF\u7EA7\u591A 5%\uFF0C\u6E14\u7FC1\u6BCF\u6668\u9001\u9C7C\u9975\u3001\u629B\u7AFF\u4E5F\u66F4\u7701\u529B\u3002\u4EA4\u60C5\u5230\u201C\u53CB\u4EBA\u201D\u65F6\uFF0C\u4E09\u4EBA\u8FD8\u4F1A\u5404\u6559\u4F60\u4E00\u9053\u83DC\u3002","The peddler, the painter and the fisherman will each accept one gift a day: crops, fish, wild finds, eggs, dishes or preserves. Each has three favorites that raise your bond fastest, and tells you one of them every time the bond deepens. Gifts count double on festival days. There are four levels: the peddler takes 5% off seeds per level, the painter makes notices pay 5% more per level, and the fisherman sends bait every morning and teaches you a cast that costs less stamina. At the second level each of them also teaches you a dish.")}</p>
