<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#efe6d2">
<title>墨田记 · 水墨田园</title>
<style>
:root {
  --paper: #efe6d2;
  --paper-dark: #e2d6bc;
  --ink: #2a2a30;
  --ink-soft: #5a5a62;
  --red: #b9412f;
  --indigo: #3f5a70;
  --kai: "KaiTi", "STKaiti", "Kaiti SC", "AR PL UKai CN", "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif;
  --brush: "Ma Shan Zheng", "KaiTi", "STKaiti", "Kaiti SC", "AR PL UKai CN", "Noto Serif SC", serif; /* 题字用毛笔体，联网时才有 */
  --rough: 255px 18px 225px 18px / 18px 225px 18px 255px;
  --slot: 60px;
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--paper); font-family: var(--kai); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hidden { display: none !important; }
button { font-family: var(--kai); color: var(--ink); cursor: pointer; }

.paper {
  background: linear-gradient(135deg, rgba(244, 236, 218, 0.94), rgba(232, 222, 198, 0.94));
  border: 2px solid var(--ink);
  border-radius: var(--rough);
  box-shadow: 2px 3px 0 rgba(42, 42, 48, 0.18);
}
.seal {
  background: var(--red); color: #f6ecd8; font-weight: bold; text-align: center;
  border-radius: 6px 9px 5px 10px; box-shadow: inset 0 0 0 2px rgba(246, 236, 216, 0.55), 0 0 0 1px var(--red);
}

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { position: absolute; }
#date { top: 18px; right: 20px; display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 12px; }
#d-season { width: 46px; height: 46px; line-height: 46px; font-size: 28px; }
#d-term { font-size: 19px; letter-spacing: 2px; }
#d-time { font-size: 16px; color: var(--ink-soft); margin-top: 2px; }
#d-weather { font-size: 22px; border-left: 1px solid var(--ink-soft); padding-left: 12px; }
#money { top: 96px; right: 20px; padding: 6px 16px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
#money b { font-size: 22px; }
.coin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #a8842c; background: transparent; box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 9px #a8842c; }

#stamina { right: 24px; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 15px; writing-mode: vertical-rl; }
#stamina .bar { width: 16px; height: 150px; border: 2px solid var(--ink); border-radius: 9px 7px 10px 6px; background: rgba(239, 230, 210, 0.8); position: relative; overflow: hidden; }
#stamina i { position: absolute; left: 0; right: 0; bottom: 0; height: var(--v, 100%); background: linear-gradient(to top, #2a2a30, #5f7f6a); transition: height 0.3s; }
#stamina.low i { background: linear-gradient(to top, #7a2a20, var(--red)); }

#hotbar { left: 50%; bottom: calc(18px + var(--sb)); transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
.slot {
  width: var(--slot); height: var(--slot); position: relative; display: flex; align-items: center; justify-content: center; flex: none;
  background: rgba(240, 232, 212, 0.9); border: 2px solid var(--ink-soft); border-radius: 12px 16px 11px 17px / 16px 11px 17px 12px; cursor: pointer;
}
.slot.sel { border: 3px solid var(--red); transform: translateY(-6px); background: #f6efdc; box-shadow: 0 5px 0 rgba(42, 42, 48, 0.2); }
.slot .key { position: absolute; top: 1px; left: 5px; font-size: 11px; color: var(--ink-soft); font-family: sans-serif; }
.slot .n { position: absolute; right: 4px; bottom: 1px; font-size: 14px; font-family: Georgia, serif; font-weight: bold; }
.icon {
  width: calc(var(--slot) * 0.67); height: calc(var(--slot) * 0.67); display: flex; align-items: center; justify-content: center; flex: none;
  font-size: calc(var(--slot) * 0.42); line-height: 1; font-weight: bold; color: var(--c, var(--ink));
  border: 2.5px solid var(--c, var(--ink)); border-radius: 50% 46% 52% 44% / 46% 52% 44% 50%; background: rgba(255, 252, 240, 0.6);
}
.icon.seed { border-style: dashed; font-size: calc(var(--slot) * 0.34); border-radius: 30% 50% 30% 50%; color: var(--ink); border-color: #a8842c; }
.icon.tool { border-radius: 8px 10px 7px 11px; }
.icon.fish { border-radius: 60% 40% 40% 60% / 50%; }
#held-name { left: 50%; bottom: calc(var(--slot) + 32px + var(--sb)); transform: translateX(-50%); font-size: 17px; letter-spacing: 2px; text-shadow: 0 0 6px var(--paper), 0 0 6px var(--paper), 0 0 6px var(--paper); white-space: nowrap; }

#tile-info { left: 50%; bottom: calc(var(--slot) + 58px + var(--sb)); transform: translateX(-50%); font-size: 15px; letter-spacing: 1px; padding: 2px 14px; white-space: nowrap; color: var(--ink); background: rgba(239, 230, 210, 0.85); border: 1.5px solid var(--ink-soft); border-radius: var(--rough); }
#tile-info:empty { display: none; }
#prompt { left: 50%; top: 72%; transform: translateX(-50%); padding: 6px 18px; font-size: 18px; background: rgba(239, 230, 210, 0.92); border: 2px solid var(--ink); border-radius: var(--rough); }
#prompt kbd { font-family: var(--kai); background: var(--ink); color: var(--paper); padding: 0 7px; border-radius: 4px; margin-right: 6px; }
#toasts { left: 50%; top: 20%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.toast { padding: 7px 22px; font-size: 18px; background: rgba(42, 42, 48, 0.86); color: var(--paper); border-radius: var(--rough); animation: toast 2.6s forwards; white-space: nowrap; }
.toast.goal { background: var(--red); font-size: 20px; }
@keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-8px); } }
#floats { left: 50%; top: 50%; }
.float { position: absolute; transform: translateX(-50%); white-space: nowrap; font-size: 20px; font-weight: bold; color: var(--red); text-shadow: 0 0 5px var(--paper), 0 0 5px var(--paper); animation: floatup 1.3s forwards; }
@keyframes floatup { from { opacity: 1; top: 0; } to { opacity: 0; top: -70px; } }

#corner { left: 18px; top: 18px; display: flex; gap: 8px; pointer-events: auto; }
#corner button { width: 40px; height: 40px; font-size: 20px; background: rgba(239, 230, 210, 0.9); border: 2px solid var(--ink); border-radius: 50% 44% 52% 46%; }
#corner button:hover, .slot:hover { background: #fbf5e4; }
#corner button.off { color: #aaa; text-decoration: line-through; }

#fishing { left: 50%; top: 40%; width: 0; height: 0; }
#fishing .target, #fishing .ring { position: absolute; left: -45px; top: -45px; width: 90px; height: 90px; border-radius: 50%; }
#fishing .target { border: 7px solid rgba(185, 65, 47, 0.75); border-radius: 50% 46% 52% 47%; }
#fishing .ring { --s: 1; transform: scale(var(--s)); border: calc(4px / var(--s)) solid var(--ink); border-radius: 48% 52% 47% 50%; }
#fishing .fish-text { position: absolute; top: 150px; left: 0; transform: translateX(-50%); white-space: nowrap; padding: 5px 18px; font-size: 19px; background: rgba(239, 230, 210, 0.92); border: 2px solid var(--ink); border-radius: var(--rough); }

/* ---------- 面板 ---------- */
#panel { position: fixed; inset: 0; background: rgba(239, 230, 210, 0.45); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.sheet { width: min(860px, 94vw); max-height: 88vh; overflow: auto; padding: 22px 30px 26px; border-radius: 14px 18px 12px 20px; }
.sheet h2 { font-family: var(--brush); margin: 0 0 4px; font-size: 30px; letter-spacing: 8px; display: flex; align-items: center; gap: 14px; }
.sheet h2 .seal { font-size: 15px; padding: 3px 7px; letter-spacing: 1px; }
.sheet h3 { margin: 16px 0 8px; font-size: 19px; border-bottom: 1px solid var(--ink-soft); padding-bottom: 4px; letter-spacing: 3px; }
.sheet .close { position: sticky; float: right; top: 0; width: 36px; height: 36px; font-size: 20px; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper); }
.sheet p { font-size: 17px; line-height: 1.75; margin: 6px 0; }
.sheet .muted { color: var(--ink-soft); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(8, var(--slot)); gap: 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.bag-cols { display: grid; grid-template-columns: auto 1fr; gap: 26px; }
.row { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px dashed rgba(90, 90, 98, 0.35); font-size: 17px; }
.row .grow { flex: 1; min-width: 0; }
.row small { display: block; color: var(--ink-soft); font-size: 13px; }
.row .price { font-family: Georgia, serif; font-weight: bold; white-space: nowrap; }
.btn { padding: 3px 12px; font-size: 16px; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px 13px 9px 14px; white-space: nowrap; }
.btn:hover { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: 0.35; pointer-events: none; }
.btn.on { background: var(--ink); color: var(--paper); }
.seg { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 17px; }
.seg input[type=range] { width: 220px; accent-color: var(--red); }
.row.done { opacity: 0.5; }
.btn.red { border-color: var(--red); color: var(--red); }
.btn.red:hover { background: var(--red); color: var(--paper); }
.detail { min-height: 96px; }
.detail b { font-size: 22px; }
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.goal { padding: 6px 10px; border: 1.5px dashed var(--ink-soft); border-radius: 8px; font-size: 15px; color: var(--ink-soft); }
.goal.done { border: 2px solid var(--red); color: var(--ink); }
.goal b { display: block; font-size: 18px; }
.goal.done b::after { content: " ✓"; color: var(--red); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 17px; align-items: center; }
.keys kbd { font-family: var(--kai); background: var(--ink); color: var(--paper); padding: 1px 9px; border-radius: 5px; text-align: center; }
.center { text-align: center; }
.actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 18px; margin-top: 18px; }
.actions .btn { font-size: 20px; padding: 6px 26px; }

/* ---------- 标题 ---------- */
#title { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(239, 230, 210, 0.2) 0%, rgba(239, 230, 210, 0.75) 75%); transition: opacity 0.9s; }
#title.out { opacity: 0; pointer-events: none; }
.title-card { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto auto auto; justify-items: center; align-items: center; column-gap: 18px; text-align: center; }
.title-card h1 { grid-column: 1; grid-row: 1; margin: 0; white-space: nowrap; font-family: var(--brush); font-size: clamp(48px, min(13vh, 20vw), 150px); letter-spacing: 0.12em; font-weight: bold; color: var(--ink); text-shadow: 3px 3px 0 rgba(42, 42, 48, 0.12), 0 0 30px var(--paper), 0 0 30px var(--paper); }
.seal.big { grid-column: 2; grid-row: 1; align-self: end; margin-bottom: 26px; font-size: 24px; line-height: 1.15; padding: 8px 9px; }
.sub { grid-column: 1 / 3; font-size: 24px; letter-spacing: 10px; margin: 4px 0 30px; text-shadow: 0 0 10px var(--paper), 0 0 10px var(--paper); }
.title-btns { grid-column: 1 / 3; display: flex; gap: 16px 22px; flex-wrap: wrap; justify-content: center; }
.brush { font-size: 26px; padding: 10px 34px; letter-spacing: 6px; background: var(--ink); color: var(--paper); border: none; border-radius: var(--rough); box-shadow: 3px 4px 0 rgba(42, 42, 48, 0.25); }
.brush:hover { background: var(--red); }
#btn-continue { background: var(--red); }
.hint { grid-column: 1 / 3; margin-top: 28px; font-size: 16px; color: var(--ink-soft); letter-spacing: 2px; text-shadow: 0 0 8px var(--paper), 0 0 8px var(--paper); }

#fade { position: fixed; inset: 0; background: #1e1e24; opacity: 0; pointer-events: none; transition: opacity 0.9s; display: flex; align-items: center; justify-content: center; }
#fade.on { opacity: 1; pointer-events: auto; }
#fade-text { color: var(--paper); text-align: center; font-size: 22px; line-height: 2; letter-spacing: 4px; }
#fade-text h2 { font-family: var(--brush); font-size: 54px; margin: 0 0 6px; letter-spacing: 14px; }
#fade-text .seal { display: inline-block; font-size: 26px; padding: 4px 10px; margin-bottom: 14px; }
#fade-text .muted { color: #a8a294; font-size: 16px; }
#err { position: fixed; left: 10px; bottom: 10px; color: var(--red); font: 13px monospace; white-space: pre-wrap; max-width: 80vw; pointer-events: none; }

/* ---------- 指引、画卷、农谚 ---------- */
#guide { left: 18px; top: 70px; max-width: 250px; padding: 6px 12px 7px; font-size: 15px; line-height: 1.4; border-width: 1.5px; }
#guide b { display: block; font-size: 12px; color: var(--red); letter-spacing: 1px; }
body.touch #guide { left: calc(12px + var(--sl)); top: 60px; max-width: 200px; font-size: 13px; }
.scroll4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 10px; }
.hang { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 8px 10px; border: 2px solid var(--ink-soft); background: rgba(255, 252, 240, 0.5); border-radius: 4px 6px 3px 7px; text-align: center; font-size: 14px; }
.hang.done { border-color: var(--red); }
.hang canvas { width: 100%; height: auto; border: 1px solid rgba(90, 90, 98, 0.4); }
.hang b { font-size: 17px; display: flex; align-items: center; gap: 4px; }
.hang .seal { font-size: 14px; padding: 1px 4px; }
.hang .need { --slot: 34px; display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; opacity: 0.6; line-height: 1.2; }
.hang .need.ok { opacity: 1; }
.hang .btn { font-size: 14px; white-space: normal; margin-top: 2px; }
.saying { font-size: 20px; color: #e8dcc0; margin: 4px 0; }
body.en .saying { font-style: italic; font-size: 18px; }

/* ---------- 地图与存档码 ---------- */
#mapcv { display: block; width: auto; height: auto; max-width: 100%; max-height: 62vh; margin: 8px auto 0; border: 2px solid var(--ink-soft); border-radius: 4px 7px 3px 6px; margin-top: 8px; }
#savecode { width: 100%; font: 12px/1.4 monospace; padding: 6px 8px; margin: 4px 0 8px; background: rgba(255, 252, 240, 0.7); border: 1.5px solid var(--ink-soft); border-radius: 6px; resize: vertical; user-select: text; -webkit-user-select: text; }

/* ---------- 账本、留影、帧率 ---------- */
.ledger { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 4px 0 0; }
.lbar { flex: 1; min-width: 0; max-width: 64px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; font-size: 12px; font-family: Georgia, serif; }
.lbar i { display: block; width: 70%; min-height: 2px; background: linear-gradient(to top, #2a2a30, #5f7f6a); border-radius: 3px 4px 0 0; }
.lbar small { font-family: var(--kai); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.photo { display: block; max-width: 100%; max-height: 58vh; margin: 8px auto 0; border: 6px solid #f6efdc; outline: 2px solid var(--ink-soft); box-shadow: 3px 4px 0 rgba(42, 42, 48, 0.2); -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; }
a.btn { text-decoration: none; color: var(--ink); display: inline-block; }
#fps { left: 18px; bottom: 14px; font: 12px/1 monospace; color: var(--ink-soft); background: rgba(239, 230, 210, 0.75); padding: 3px 7px; border-radius: 4px; }
body.touch #fps { left: 50%; bottom: auto; top: 2px; transform: translateX(-50%); }

/* ---------- 图鉴与语言 ---------- */
.almanac { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px 6px; }
.entry { --slot: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; line-height: 1.2; text-align: center; }
.entry.unseen { opacity: 0.32; }
#btn-lang { grid-column: 1 / 3; margin-top: 16px; font-size: 15px; padding: 4px 16px; background: rgba(239, 230, 210, 0.85); }

/* 英文：拉丁字母用衬线体（汉字图标仍回落到楷体），并收紧为汉字设计的字距 */
body.en { --kai: Georgia, "Iowan Old Style", "Palatino Linotype", "Noto Serif", "KaiTi", "STKaiti", "Kaiti SC", "AR PL UKai CN", "Noto Serif SC", serif; }
body.en #d-term { letter-spacing: 0; font-size: 17px; }
body.en #d-weather { font-size: 17px; }
body.en #held-name, body.en .hint, body.en #tile-info { letter-spacing: 0.3px; }
body.en .sheet h2 { font-family: var(--kai); font-style: italic; letter-spacing: 0.5px; font-size: 28px; }
body.en .sheet h2 .seal { font-style: normal; letter-spacing: 0; }
body.en .sheet h3 { letter-spacing: 0.5px; }
body.en .sheet p, body.en .row, body.en .keys { font-size: 16px; line-height: 1.55; }
body.en .sub { letter-spacing: 1.5px; font-size: 21px; font-style: italic; }
body.en .brush { letter-spacing: 1px; font-size: 23px; }
body.en #fade-text { letter-spacing: 0.5px; line-height: 1.8; }
body.en #fade-text h2 { font-family: var(--kai); font-style: italic; letter-spacing: 1px; font-size: 44px; }
body.en #corner button { width: auto; min-width: 40px; padding: 0 13px; font-size: 15px; border-radius: 20px 17px 21px 18px; }
body.en #stamina { font-size: 13px; }
body.en.touch #btn-act { font-size: 24px; font-style: italic; }
body.en.touch #d-term { font-size: 13px; }
body.en.touch #d-weather { font-size: 14px; }
body.en.touch #corner { align-items: flex-start; }
body.en.touch #corner button { font-size: 13px; padding: 0 10px; height: 36px; }
body.en.touch .sub { font-size: 17px; }
body.en.touch .sheet h2 { letter-spacing: 0.5px; font-size: 22px; }

/* ---------- 触屏与小屏 ---------- */
#joy, #btn-act { display: none; }
.hint .mobile { display: none; }
#prompt { pointer-events: auto; cursor: pointer; }

body.touch { --slot: clamp(34px, calc((100vw - 51px) / 8), 54px); }
body.touch .hint .pc, body.touch #prompt kbd, body.touch .slot .key { display: none; }
body.touch .hint .mobile { display: inline; }
body.touch #hotbar { gap: 5px; bottom: calc(8px + var(--sb)); }
body.touch #joy {
  display: block; left: calc(18px + var(--sl)); bottom: calc(var(--slot) + 46px + var(--sb)); width: 128px; height: 128px; border-radius: 50%;
  border: 2px solid rgba(42, 42, 48, 0.5); background: rgba(239, 230, 210, 0.35); pointer-events: auto; touch-action: none;
}
#joy-knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(42, 42, 48, 0.55); border: 2px solid var(--paper); }
body.touch #btn-act {
  display: block; right: calc(22px + var(--sr)); bottom: calc(var(--slot) + 56px + var(--sb)); width: 92px; height: 92px; font-size: 36px; font-weight: bold;
  color: var(--paper); background: rgba(185, 65, 47, 0.82); border: 3px solid var(--paper); border-radius: 50% 46% 52% 47%; box-shadow: 0 0 0 2px var(--red);
  pointer-events: auto; touch-action: none;
}
body.touch #btn-act.down { background: var(--ink); transform: scale(0.94); }
body.touch #prompt { top: auto; bottom: calc(var(--slot) + 92px + var(--sb)); padding: 9px 24px; font-size: 19px; background: var(--ink); color: var(--paper); border-color: var(--paper); box-shadow: 0 0 0 2px var(--ink); }
body.touch #corner { left: calc(12px + var(--sl)); top: 12px; }
body.touch #date { top: 12px; right: calc(12px + var(--sr)); padding: 6px 12px 6px 8px; gap: 8px; }
body.touch #d-season { width: 36px; height: 36px; line-height: 36px; font-size: 22px; }
body.touch #d-term { font-size: 15px; letter-spacing: 1px; }
body.touch #d-time { font-size: 13px; }
body.touch #d-weather { font-size: 18px; padding-left: 8px; }
body.touch #money { top: 66px; right: calc(12px + var(--sr)); padding: 3px 12px; font-size: 15px; }
body.touch #money b { font-size: 18px; }
/* 体力条改为横条，放在钱数下方，给右下的劳作键让位 */
body.touch #stamina { right: calc(12px + var(--sr)); top: 104px; bottom: auto; flex-direction: row; writing-mode: horizontal-tb; font-size: 13px; }
body.touch #stamina .bar { width: 96px; height: 12px; }
body.touch #stamina i { top: 0; right: auto; height: 100%; width: var(--v, 100%); transition: width 0.3s; }
body.touch #toasts { top: 150px; }
body.touch .toast { font-size: 16px; white-space: normal; text-align: center; max-width: 86vw; }
body.touch .sheet { padding: 16px 16px 20px; max-height: 92vh; }
body.touch .sheet h2 { font-size: 24px; letter-spacing: 5px; }
body.touch .btn { padding: 6px 13px; }
body.touch .row { flex-wrap: wrap; justify-content: flex-end; }
body.touch .row .grow { min-width: 6em; }
body.touch #fishing { top: 34%; }
body.touch #fishing .fish-text { top: 110px; font-size: 16px; }

/* 手机横屏：摇杆与劳作键落到底边，快捷栏夹在中间 */
@media (orientation: landscape) {
  body.touch { --slot: clamp(32px, calc((100vw - 350px - var(--sl) - var(--sr)) / 8.7), 54px); }
  body.touch #joy { bottom: calc(14px + var(--sb)); width: 118px; height: 118px; }
  body.touch #btn-act { bottom: calc(18px + var(--sb)); }
  body.touch #prompt { bottom: calc(var(--slot) + 62px + var(--sb)); }
  body.touch .title-card h1 { font-size: clamp(54px, 22vh, 120px); }
  body.touch .sub { margin-bottom: 14px; font-size: 19px; }
  body.touch .hint { margin-top: 12px; }
  body.touch .seal.big { font-size: 18px; margin-bottom: 14px; }
}
/* 竖屏：左上按钮竖排，免得与日期牌相撞 */
@media (orientation: portrait) {
  body.touch #corner { flex-direction: column; }
  body.touch #guide { top: 254px; }
  /* 竖屏时提示条挪到摇杆上方，免得被摇杆和劳作键夹住 */
  body.touch #prompt { bottom: calc(var(--slot) + 196px + var(--sb)); max-width: 88vw; text-align: center; }
  .scroll4 { grid-template-columns: repeat(2, 1fr); }
  body.touch .title-card { max-width: 94vw; }
  body.touch .sub { font-size: 19px; letter-spacing: 6px; }
  body.touch .hint { font-size: 14px; line-height: 1.7; }
}

@media (max-width: 760px) {
  :root { --slot: 46px; }
  .grid { grid-template-columns: repeat(6, var(--slot)); gap: 6px; } .cols, .bag-cols { grid-template-columns: 1fr; gap: 10px; }
  .goals { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}

/* 交情与赠礼 */
.bond { border: 1px solid rgba(42, 42, 48, 0.18); border-radius: 6px 9px 7px 10px; padding: 8px 12px 10px; margin: 6px 0 10px; background: rgba(255, 255, 255, 0.22); }
.bond p { margin: 4px 0; }
.bond-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 5px; }
.pips i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--red); display: block; }
.pips i.on { background: var(--red); }
.loves { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; --slot: 40px; }
.love { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.love small { font-size: 12px; }
.love.unk { opacity: 0.4; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; --slot: 46px; }
.slot.pick { cursor: pointer; font: inherit; color: inherit; padding: 0; }
.slot.pick:hover { border-color: var(--red); }
.icon.brew { border-radius: 30% 30% 46% 46% / 22% 22% 60% 60%; }
.trend { color: var(--red); font-weight: normal; white-space: nowrap; }
.price .up { color: var(--red); margin-right: 3px; }
.icon.fruit { border-radius: 50% 50% 46% 46% / 42% 42% 58% 58%; }
.yearend { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(42, 42, 48, 0.25); }
.yearend b { display: block; color: var(--red); margin-bottom: 4px; }
.tabs { margin: 4px 0 6px; flex-wrap: wrap; }
#guide.chores div { font-size: 0.93em; }
#buff { top: 146px; right: 20px; padding: 3px 12px 4px; font-size: 14px; border-width: 1.5px; }
#buff b { color: var(--red); margin-right: 6px; }
body.touch #buff { top: 100px; right: calc(12px + var(--sr)); font-size: 12px; padding: 2px 10px; }
@media (orientation: portrait) { body.touch #buff { top: 132px; } }
.letter { border-bottom: 1px dashed rgba(90, 90, 98, 0.35); padding: 8px 0 10px; }
.letter b { color: var(--red); }
.letter p { margin: 4px 0 6px; line-height: 1.6; }
.letter.done { opacity: 0.55; }
.slot.pick .n { font-size: 12px; }
/* 存档位、界面缩放、手柄焦点 */
.slots { grid-column: 1 / 3; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.slotbtn { font: inherit; color: var(--ink); background: rgba(255, 252, 240, 0.55); border: 1.5px solid var(--ink-soft); border-radius: 8px 11px 7px 12px; padding: 5px 14px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; min-width: 118px; }
.slotbtn small { font-size: 12px; color: var(--ink-soft); }
.slotbtn.on { border: 2px solid var(--red); background: #f6efdc; }
.slotbtn.on b { color: var(--red); }
#hud, #sheet, #fade-text { zoom: var(--ui, 1); }
#sheet button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
@media (orientation: portrait) { body.touch #hotbar { zoom: calc(1 / var(--ui, 1)); } }
.keep { display: inline-block; border: 1.5px solid var(--red); color: var(--red); border-radius: 4px 6px 5px 7px; padding: 0 7px; font-size: 13px; margin: 2px 3px 2px 0; }
.bond .need { font-size: 14px; color: var(--ink-soft); }
.bond .need.ok { color: #3f6f4a; font-weight: bold; }
.icon.bug { border-radius: 46% 54% 40% 60% / 60% 40% 54% 46%; }
#guide.chores { pointer-events: auto; cursor: pointer; }
/* 历书 */
#date { pointer-events: auto; cursor: pointer; }
.cal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 6px 0 10px; }
.cday { border: 1.5px solid var(--ink-soft); border-radius: 6px 9px 7px 10px; padding: 4px 6px 5px; min-height: 62px; background: rgba(255, 252, 240, 0.5); display: flex; flex-direction: column; gap: 1px; }
.cday b { font-family: Georgia, serif; font-size: 18px; }
.cday small { font-size: 12px; color: var(--ink-soft); line-height: 1.15; }
.cday span { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: auto; }
.cday i { font-style: normal; font-size: 11px; border: 1px solid var(--indigo); color: var(--indigo); border-radius: 3px; padding: 0 3px; }
.cday i.fest { border-color: var(--red); color: var(--red); }
.cday em { font-style: normal; font-size: 11px; color: var(--ink-soft); }
.cday.today { border: 2.5px solid var(--red); background: #f6efdc; }
.cday.past { opacity: 0.45; }
@media (max-width: 760px) { .cal { grid-template-columns: repeat(4, 1fr); } }
.fishbook { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 6px 0 10px; }
.fishbook .entry small { color: var(--ink-soft); font-size: 12px; }
/* 晨报：两侧留白，条目一行一条；显示期间可点按收起 */
#fade-text { max-width: min(92vw, 760px); padding: 0 14px; box-sizing: border-box; }
#fade-text .report { line-height: 1.55; margin-top: 6px; }
#fade-text .report div { margin: 3px 0; }
#fade.tap { pointer-events: auto; }
@media (max-width: 760px) { #fade-text { font-size: 18px; letter-spacing: 2px; line-height: 1.7; } #fade-text h2 { font-size: 42px; letter-spacing: 8px; } #fade-text .muted { font-size: 14px; } body.en #fade-text h2 { font-size: 34px; } }
/* 手机竖屏：每行先放图标与文字，价钱和按钮整体换到下一行靠右，免得按钮一上一下 */
@media (orientation: portrait) { body.touch .row .grow { min-width: calc(100% - 64px); } }
.finale .hang { min-height: 0; }
.story { font-size: 1.1em; line-height: 1.9; text-align: center; margin: 12px 6%; }
.build { grid-column: 1 / 3; margin: 0; font: 11px/1 sans-serif; color: var(--ink-soft); opacity: 0.6; text-align: center; letter-spacing: 0.5px; }
.icon.silk { border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%; }
.swatch { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; margin-right: 6px; vertical-align: -0.05em; border: 1px solid rgba(0, 0, 0, 0.25); }
button.entry { font: inherit; color: inherit; background: none; border: 1.5px solid transparent; border-radius: 8px; padding: 3px 2px; cursor: pointer; }
button.entry.sel { border-color: var(--red); background: rgba(255, 252, 240, 0.6); }
/* 手册条目 */
.guide { margin: 6px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 9px 18px; align-items: baseline; }
.guide dt { color: var(--red); font-weight: bold; white-space: nowrap; }
.guide dd { margin: 0; line-height: 1.65; }
body.en .guide dd { font-size: 16px; line-height: 1.5; }
@media (max-width: 760px) { .guide { grid-template-columns: 1fr; gap: 2px 0; } .guide dd { margin-bottom: 9px; } .guide dt { white-space: normal; } }
/* 画面丢失（手机切后台回来偶尔会这样）时的提示 */
#lost { position: fixed; inset: 0; z-index: 50; background: rgba(30, 30, 36, 0.72); display: flex; align-items: center; justify-content: center; }
#lost.hidden { display: none; }
#lost .paper { padding: 18px 26px; text-align: center; max-width: 80vw; font-size: 18px; }
#lost p { margin: 0 0 12px; }
/* 柜子 */
.chest-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 26px; --slot: 46px; }
.chest-cols .grid { gap: 6px; grid-template-columns: repeat(auto-fill, var(--slot)); }
.chest-cols + .actions { flex-wrap: wrap; gap: 10px 18px; }
.slot.locked { opacity: 0.4; cursor: default; }
@media (max-width: 700px) { .chest-cols { grid-template-columns: 1fr; --slot: 44px; } .chest-cols + .actions .btn { font-size: 17px; padding: 6px 16px; } }
.chest-cols button.slot { font: inherit; color: inherit; padding: 0; cursor: pointer; }
.chest-cols button.slot:disabled { cursor: default; }
/* 提笔写字 */
.fu { display: block; margin: 6px auto 0; width: min(340px, 100%, 46vh); aspect-ratio: 1; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
.fu-acts { flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; }
.fu-acts .btn { font-size: 17px; padding: 6px 16px; }
.inchest { color: var(--red); }

</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="date" class="paper">
    <div id="d-season" class="seal">春</div>
    <div class="date-text">
      <div id="d-term">立春 · 第一日</div>
      <div id="d-time">卯时 06:00</div>
    </div>
    <div id="d-weather">晴</div>
  </div>
  <div id="money" class="paper"><span class="coin"></span><b id="m-val">0</b> <span id="m-unit">文</span></div>
  <div id="buff" class="paper hidden"></div>
  <div id="stamina" title="体力"><div class="bar"><i id="st-fill"></i></div><span id="st-label">体力</span></div>
  <div id="hotbar"></div>
  <div id="guide" class="paper hidden"></div>
  <div id="fps" class="hidden"></div>
  <div id="tile-info"></div>
  <div id="held-name"></div>
  <div id="prompt" class="hidden"></div>
  <div id="toasts"></div>
  <div id="floats"></div>
  <div id="corner">
    <button id="btn-bag" title="行囊 (Tab)">囊</button>
    <button id="btn-help" title="帮助 (H)">？</button>
    <button id="btn-mute" title="静音 (M)">乐</button>
    <button id="btn-map" title="地图 (N)">图</button>
    <button id="btn-set" title="设置">设</button>
  </div>
  <div id="joy"><div id="joy-knob"></div></div>
  <button id="btn-act">作</button>
  <div id="fishing" class="hidden">
    <div class="target"></div>
    <div class="ring" id="fish-ring"></div>
    <div class="fish-text" id="fish-text"></div>
  </div>
</div>

<div id="panel" class="hidden"><div class="sheet paper" id="sheet"></div></div>

<div id="title">
  <div class="title-card">
    <h1>墨田记</h1>
    <div class="seal big">耕<br>读</div>
    <p class="sub" id="t-sub">水墨田园 · 四时耕作</p>
    <div id="slots" class="slots"></div>
    <div class="title-btns">
      <button id="btn-continue" class="brush hidden">续耕旧田</button>
      <button id="btn-new" class="brush">开垦新田</button>
    </div>
    <p class="hint"><span class="pc" id="t-hint-pc">WASD 行走 · 鼠标点击劳作 · E 交互 · Tab 行囊 · H 帮助</span><span class="mobile" id="t-hint-touch">左下摇杆行走 · 右下“作”键或点触地面劳作 · 拖动转视角 · 双指缩放</span></p>
    <button id="btn-lang" class="btn">English</button>
    <p class="build" id="t-build"></p>
  </div>
</div>

<div id="fade"><div id="fade-text"></div></div>
<div id="err"></div>
<div id="lost" class="hidden"><div class="paper"><p id="lost-text"></p><button id="lost-btn" class="btn red"></button></div></div>

C14\u4E24\u65E5\u3002\u4E00\u65E5\u7EA6\u516D\u5206\u949F\uFF0C\u53EF\u5728\u201C\u8BBE\u201D\u91CC\u8C03\u5FEB\u6162\u3002","A year has four seasons of twelve days, divided into 24 solar terms of two days each. A day lasts about six minutes; change the pace in Options."],["\u8015\u79CD","Farming","\u9504\u5730\u3001\u64AD\u79CD\u3001\u6BCF\u65E5\u6D47\u6C34\uFF0C\u6210\u719F\u540E\u4E00\u70B9\u5373\u6536\u3002\u4F5C\u7269\u987B\u5728\u5F53\u5B63\u64AD\u79CD\uFF0C\u6362\u5B63\u65F6\u4E0D\u5408\u65F6\u4EE4\u7684\u4F1A\u67AF\u840E\u3002\u96E8\u96EA\u5929\u4E0D\u5FC5\u6D47\u6C34\u3002","Till, sow, water every day, then click a ripe crop to harvest. Crops must be sown in season, and out-of-season plants wither when the season turns. Rain and snow do the watering."],["\u65F6\u4EE4","In season","\u6BCF\u4E2A\u8282\u6C14\u5404\u5E26\u4E00\u9879\u597D\u5904\uFF08\u5982\u6E05\u660E\u8336\u8D35\u3001\u8C37\u96E8\u50AC\u82D7\u3001\u60CA\u86F0\u9504\u5730\u7701\u529B\uFF09\u3002\u5F53\u65E5\u7684\u5199\u5728\u201C\u519C\u4E8B\u201D\u7B2C\u4E00\u884C\uFF1B\u70B9\u53F3\u4E0A\u89D2\u65E5\u671F\u724C\uFF08\u6216\u6309 C\uFF09\u770B\u6574\u5B63\u7684\u5386\u4E66\u3002","Every solar term brings a benefit of its own (tea is dear at Clear and Bright, crops surge at Grain Rain, the hoe is light when Insects Awaken). Today\u2019s is the first line of the to-do list; tap the date panel (or press C) for the whole season\u2019s almanac."],["\u8F6E\u4F5C","Rotation","\u4E00\u683C\u7530\u6362\u79CD\u4E0E\u4E0A\u4E00\u832C\u4E0D\u540C\u7684\u4F5C\u7269\uFF0C\u8FD9\u4E00\u832C\u6BCF\u6B21\u6536\u83B7\u6709\u4E09\u6210\u673A\u4F1A\u591A\u5F97\u4E00\u4EFD\u3002\u6307\u7740\u7530\u683C\u80FD\u770B\u5230\u4E0A\u832C\u662F\u4EC0\u4E48\u3002","Sow a plot with something other than its last crop and each harvest has a three-in-ten chance of one extra. Point at a plot to see what it grew last."],["\u5E74\u666F\u4E0E\u5947\u9047","Fortunes","\u7B2C\u4E8C\u5E74\u8D77\u6BCF\u5E74\u5F00\u6625\u5B9A\u4E00\u6837\u201C\u5E74\u666F\u201D\uFF0C\u7BA1\u4E00\u6574\u5E74\u3002\u5E73\u5E38\u65E5\u5B50\u7EA6\u4E09\u6210\u673A\u4F1A\u78B0\u4E0A\u4E00\u6869\u5F53\u65E5\u6709\u6548\u7684\u201C\u5947\u9047\u201D\uFF0C\u90FD\u662F\u597D\u4E8B\u3002","From the second year, each New Year fixes a fortune for the whole year. On ordinary days there is about a three-in-ten chance of a windfall that lasts the day. They are always good news."],["\u8D27\u90CE","The peddler","\u7530\u897F\u7684\u8D27\u90CE\u5356\u79CD\u5B50\u3001\u5668\u7269\uFF0C\u6536\u4F60\u7684\u8D27\u3002\u7EA6\u534A\u6570\u65E5\u5B50\u6709\u201C\u884C\u60C5\u201D\uFF0C\u67D0\u4E00\u7C7B\u8D27\u5F53\u65E5\u591A\u5356\u4E24\u6210\uFF1B\u5C31\u5BDD\u524D\u80FD\u542C\u5230\u660E\u65E5\u884C\u60C5\u3002","The peddler west of the field sells seeds and gear and buys your goods. On about half the days one kind of goods sells for 20% more; at bedtime you hear what tomorrow favors."],["\u5782\u9493","Fishing","\u624B\u6301\u9493\u7AFF\u70B9\u6C60\u9762\u629B\u7AFF\uFF08\u8D39 8 \u70B9\u4F53\u529B\uFF09\u3002\u54AC\u94A9\u540E\uFF0C\u5728\u58A8\u5708\u7F29\u5230\u4E0E\u6731\u5708\u76F8\u5408\u65F6\u70B9\u51FB\uFF0C\u4E2D\u4E09\u56DE\u5373\u8D77\u7AFF\uFF0C\u5931\u624B\u4E24\u56DE\u9C7C\u5C31\u8DD1\u4E86\u3002\u5E26\u7740\u9C7C\u9975\u54AC\u94A9\u66F4\u5FEB\u3001\u597D\u9C7C\u66F4\u591A\u3002","With the rod in hand, click the water to cast (8 stamina). When a fish bites, click as the ink ring shrinks onto the red one: three hits land it, two misses lose it. Carrying bait brings quicker bites and better fish."],["\u770B\u5929\u65F6\u7684\u9C7C","Fish and weather","\u91D1\u9CA4\u53EA\u5728\u96E8\u5929\u4E0A\u94A9\uFF0C\u9CD7\u9C7C\u53EA\u5728\u5165\u591C\u540E\u3002\u6BCF\u5B63\u8FD8\u85CF\u7740\u4E00\u5C3E\u201C\u9C7C\u738B\u201D\uFF0C\u4E00\u751F\u53EA\u9493\u5F97\u4E0A\u4E00\u6B21\uFF0C\u8981\u8FDE\u4E2D\u4E94\u56DE\u3002\u9493\u5230\u7684\u9C7C\u4F1A\u91CF\u5C3A\u5BF8\uFF0C\u6E14\u7FC1\u90A3\u91CC\u6709\u201C\u9C7C\u518C\u201D\u3002","Golden carp bite only in the rain, eels only after dark. Each season also hides one king of fish, landed once in a lifetime and needing five hits. Every catch is measured; the fisherman keeps your record book."],["\u4F10\u6728\u4E0E\u91CE\u7269","Wood and wild finds","\u65A7\u5934\u4F10\u8FD1\u5904\u7684\u6811\u5F97\u6728\u67F4\uFF0C\u6570\u65E5\u540E\u6811\u4F1A\u957F\u56DE\u3002\u7530\u91CE\u95F4\u6BCF\u65E5\u6563\u843D\u7740\u5F53\u5B63\u91CE\u7269\uFF08\u5730\u56FE\u4E0A\u7684\u9EC4\u70B9\uFF09\uFF0C\u96E8\u540E\u7684\u65E9\u6668\u66F4\u591A\u3002","The axe fells nearby trees for firewood; they grow back in a few days. Seasonal wild finds lie about every day (gold dots on the map), with more on the morning after rain."],["\u8349\u866B","Insects","\u5411\u8D27\u90CE\u4E70\u6355\u866B\u7F51\uFF0C\u62FF\u5728\u624B\u91CC\u8D70\u8FD1\u5373\u53EF\u6355\uFF1A\u6625\u590F\u767D\u5929\u6709\u8774\u8776\uFF0C\u590F\u65E5\u6C60\u8FB9\u6709\u873B\u8713\uFF0C\u590F\u591C\u6709\u8424\u706B\u866B\uFF0C\u79CB\u5929\u508D\u665A\u6709\u87CB\u87C0\u3002\u96E8\u96EA\u5929\u4E0D\u51FA\u6765\u3002","Buy the bug net from the peddler, hold it and walk up to catch: butterflies on spring and summer days, dragonflies by the pond in summer, fireflies on summer nights, crickets on autumn evenings. None in rain or snow."],["\u544A\u793A","Notices","\u5C4B\u4E1C\u544A\u793A\u724C\u4E0A\u7684\u6C42\u8D2D\uFF0C\u8D4F\u94B1\u9AD8\u8FC7\u8D27\u90CE\uFF0C\u4EA4\u4ED8\u540E\u4E0E\u6C42\u8D2D\u7684\u90A3\u4F4D\u4EA4\u60C5\u4E5F\u6DA8\u4E00\u70B9\u3002\u6807\u201C\u6025\u201D\u7684\u4E24\u65E5\u5185\u8981\uFF0C\u8D4F\u94B1\u683C\u5916\u9AD8\u3002","Requests on the board east of the house pay above the peddler\u2019s price, and whoever asked thinks better of you. Rush notices are wanted within two days and pay far more."],["\u5236\u4F5C","Crafting","\u884C\u56CA\u7684\u201C\u5236\u4F5C\u201D\u9875\uFF1A\u6728\u67F4\u505A\u7AF9\u6E20\uFF08\u6BCF\u6668\u6D47\u704C\u56DB\u90BB\u7530\u683C\uFF09\uFF0C\u9C7C\u505A\u80A5\u6599\uFF08\u4E00\u6B21\u6536\u83B7\u7FFB\u500D\uFF09\uFF0C\u8FD8\u80FD\u505A\u5404\u79CD\u83DC\u80B4\u3001\u871C\u996F\u3001\u7EE2\u6247\u3002","On the bag\u2019s Craft page: firewood makes bamboo channels (they water the four plots beside them each morning), a fish makes fertilizer (doubles one harvest), and there are dishes, candied fruit and silk fans to make."],["\u83DC\u80B4\u7684\u589E\u76CA","Dishes","\u83DC\u80B4\u56DE\u4F53\u529B\uFF0C\u8FD8\u5404\u5E26\u4E00\u6837\u6301\u7EED\u5230\u5C31\u5BDD\u7684\u589E\u76CA\uFF1A\u6E14\u8FD0\u3001\u5065\u6B65\u3001\u7701\u529B\u3001\u773C\u660E\u3001\u5634\u751C\u3002\u4E3A\u4E86\u589E\u76CA\u4E0D\u997F\u4E5F\u80FD\u5403\uFF0C\u540E\u5403\u7684\u9876\u6389\u5148\u5403\u7684\u3002","Dishes restore stamina and each grants a boon until bedtime: Angler\u2019s Luck, Light Feet, Easy Work, Sharp Eyes or Sweet Words. You may eat for the boon even when full; a new one replaces the old."],["\u4F53\u529B","Stamina","\u52B3\u4F5C\u8D39\u4F53\u529B\u3002\u5403\u4E1C\u897F\u3001\u6478\u6478\u963F\u9EC4\uFF08\u6BCF\u65E5\u5934\u4E00\u56DE +10\uFF09\u3001\u53BB\u6751\u897F\u5357\u7684\u6C64\u6CC9\u6CE1\u4E00\u6CE1\uFF08\u6BCF\u56DE\u8FC7\u4E00\u4E2A\u65F6\u8FB0\u3001\u56DE\u4E24\u6210\u534A\uFF0C\u4E00\u65E5\u4E24\u56DE\uFF09\u90FD\u80FD\u56DE\u590D\u3002\u96E8\u96EA\u5929\u7AD9\u5728\u4EAD\u5B50\u91CC\u6B47\u7740\uFF0C\u4F53\u529B\u4E5F\u4F1A\u6162\u6162\u56DE\u6765\u3002","Work costs stamina. Restore it by eating, by patting Huang (+10, first time each day), or by soaking in the hot spring southwest of the village (an hour each, a quarter of your stamina, twice a day). On rainy or snowy days, standing quietly in the pavilion slowly restores it too."],["\u67DC\u5B50","The chest","\u5C4B\u91CC\u6709\u53EA\u67DC\u5B50\uFF08\u8FDB\u5C4B\u540E\u70B9\u201C\u5F00\u67DC\u5B50\u201D\uFF09\uFF0C\u653E\u5F97\u4E0B 24 \u6837\u4E1C\u897F\uFF0C\u6DFB\u5EFA\u53A2\u623F\u540E 40 \u6837\u3002\u6682\u65F6\u7528\u4E0D\u4E0A\u7684\u6536\u6210\u3001\u793C\u7269\u90FD\u53EF\u4EE5\u5B58\u7740\u3002","There is a chest in the house (go inside and choose Open the chest) that holds 24 kinds of things, or 40 once the side wing is built. Keep spare harvests and gifts there."],["\u63D0\u7B14\u5199\u5B57","Brush and paper","\u8FDB\u5C4B\u540E\u70B9\u201C\u63D0\u7B14\u5199\u5B57\u201D\uFF0C\u5728\u7EA2\u7EB8\u4E0A\u5199\u4E2A\u5B57\uFF0C\u8D34\u5230\u5C4B\u95E8\u4E0A\u3002\u884C\u7B14\u6162\u5219\u7C97\uFF0C\u5FEB\u5219\u7EC6\u5E26\u98DE\u767D\uFF1B\u53EF\u64A4\u7B14\u3001\u91CD\u5199\uFF0C\u4E5F\u53EF\u63ED\u4E0B\u3002","Go inside and choose Take up the brush: write a character on red paper and paste it on your door. Slow strokes are thick, quick ones thin and dry. You can undo, start over, or take it down."],["\u6B47\u606F\u4E0E\u5B58\u6863","Sleep and saving","\u5165\u591C\u56DE\u5C4B\u6B47\u606F\u4FBF\u5230\u6B21\u65E5\u6E05\u6668\u5E76\u81EA\u52A8\u5B58\u6863\uFF0C\u53E6\u7559\u4E00\u4EFD\u524D\u4E00\u65E5\u7684\u526F\u672C\u3002\u71AC\u8FC7\u4E11\u65F6\u4F1A\u660F\u5012\uFF0C\u6B21\u65E5\u4F53\u529B\u53EA\u5269\u4E00\u534A\u3002","Go to bed to start the next morning; the game saves as you sleep and keeps the previous day\u2019s save as a backup. Stay up past 2 a.m. and you collapse, waking with half your stamina."]],estate:[["\u9E21\u4E0E\u9E2D","Chickens and ducks","\u5C0F\u9E21\u517B\u5728\u5C4B\u897F\u9E21\u820D\uFF08\u81F3\u591A\u516D\u53EA\uFF0C\u6269\u5EFA\u540E\u5341\u53EA\uFF09\uFF0C\u6BCF\u6668\u4E0B\u86CB\u3002\u9E2D\u5B50\u653E\u517B\u5728\u6C60\u5858\uFF08\u81F3\u591A\u56DB\u53EA\uFF09\uFF0C\u6625\u590F\u79CB\u6BCF\u6668\u5728\u6C60\u5357\u8349\u7A9D\u4E0B\u86CB\uFF1B\u9E2D\u86CB\u5165\u7F38\u56DB\u65E5\u6210\u54B8\u9E2D\u86CB\u3002","Chicks live in the coop west of the house (six at most, ten after the extension) and lay each morning. Ducks live on the pond (four at most) and lay in the nest on the south bank from spring to autumn; four days in a jar turns a duck egg into a salted one."],["\u6C34\u725B","Water buffalo","\u517B\u5728\u6C60\u5357\u8349\u5730\u3002\u6709\u725B\u76F8\u52A9\uFF0C\u9504\u5730\u4E0D\u8D39\u4F53\u529B\uFF1B\u6BCF\u6668\u79EF\u4E00\u4EFD\u80A5\u6599\uFF0C\u81F3\u591A\u6512\u4E09\u4EFD\uFF0C\u8D70\u8FD1\u53EF\u6536\u3002","Grazes south of the pond. With its help the hoe costs no stamina, and it leaves one fertilizer each morning (up to three wait for you)."],["\u519C\u5177","Tools","\u7CBE\u94C1\u9504\u4E00\u9504\u5F00\u4E09\u683C\uFF0C\u83B2\u84EC\u58F6\u5634\u4E00\u6B21\u6D47\u4E09\u683C\uFF0C\u7AF9\u7BD3\u4E00\u6B21\u6536\u4E09\u683C\uFF08\u90FD\u662F\u4E0E\u4F60\u671D\u5411\u5782\u76F4\u7684\u5DE6\u53F3\u4E24\u683C\uFF0C\u7530\u91CC\u4F1A\u663E\u51FA\u5C0F\u6846\uFF09\u3002\u53E6\u6709\u5927\u6C34\u58F6\u3001\u6ECB\u8865\u6C64\u3001\u6355\u866B\u7F51\uFF1B\u6E14\u7FC1\u90A3\u91CC\u5356\u7CBE\u5236\u9493\u7AFF\u3002","The iron hoe tills three plots, the rose spout waters three, the harvest basket picks three (the plot you aim at and the two beside it; small frames show which). There are also the large can, tonics and the bug net; the fisherman sells a fine rod."],["\u5C0F\u4EF6\u8425\u9020","Small works","\u6C34\u4E95\u5C31\u5728\u7530\u8FB9\uFF0C\u7701\u5F97\u8DD1\u6C60\u5858\u6C72\u6C34\uFF1B\u77F3\u706F\u5165\u591C\u81EA\u660E\uFF1B\u82B1\u5703\u56DB\u65F6\u53D8\u8272\uFF0C\u4E5F\u7ED9\u8702\u6DFB\u871C\uFF1B\u5927\u884C\u56CA\u591A\u516B\u683C\u3002","The well saves the walk to the pond; the lanterns light themselves at dusk; the flower beds change with the seasons and feed the bees; the bigger bag adds eight slots."],["\u9171\u7F38","Pickling jars","\u5C4B\u4E1C\u4E09\u53E3\u7F38\uFF0C\u6BCF\u53E3\u4E00\u6B21\u88C5\u540C\u4E00\u79CD\u4F5C\u7269\u81F3\u591A\u4E09\u4EFD\u3002\u852C\u679C\u4E24\u65E5\u6210\u9171\u83DC\uFF0C\u7A3B\u3001\u7C9F\u3001\u83CA\u3001\u53C2\u56DB\u65E5\u6210\u9152\uFF0C\u90FD\u6BD4\u9C9C\u8D27\u503C\u94B1\u3002","Three jars east of the house, each taking up to three of one crop. Vegetables cure in two days; rice, millet, chrysanthemum and ginseng become wine in four. All sell for more than fresh."],["\u8702\u7BB1","Beehives","\u6625\u590F\u79CB\u6BCF\u4E2A\u6674\u65E5\u5F97\u871C\u4E00\u7F50\uFF1B\u7530\u91CC\u5F00\u7740\u7684\u6CB9\u83DC\u82B1\u4E0E\u79CB\u83CA\u3001\u82B1\u5703\u3001\u6625\u5929\u7684\u6843\u82B1\u90FD\u80FD\u6DFB\u871C\uFF0C\u4E00\u65E5\u81F3\u591A\u4E09\u7F50\u3002","One jar of honey for each fair day from spring to autumn; rapeseed and chrysanthemum in bloom, flower beds and peach blossom add more, up to three a day."],["\u8695\u623F","Silkworm shed","\u679C\u56ED\u4E1C\u8FB9\u3002\u6625\u590F\u79CB\u6BCF\u65E5\u6DFB\u4E00\u56DE\u6851\u53F6\uFF08\u8D39 4 \u70B9\u4F53\u529B\uFF09\uFF0C\u6DFB\u6EE1\u4E94\u56DE\u5F97\u8695\u4E1D\u4E24\u675F\u3002\u9694\u51E0\u5929\u6CA1\u53BB\u4E5F\u4E0D\u8981\u7D27\u3002","East of the orchard. From spring to autumn, feed the worms once a day (4 stamina); five feedings give two skeins of silk. Missing a day does no harm."],["\u6696\u68DA\u4E0E\u6C34\u8F66","Greenhouse and waterwheel","\u6696\u68DA\u7F69\u4F4F\u7530\u5730\u897F\u5317\u89D2\u4E8C\u5341\u56DB\u683C\uFF1A\u68DA\u91CC\u56DB\u5B63\u7684\u79CD\u5B50\u90FD\u80FD\u79CD\uFF0C\u6362\u5B63\u4E0D\u67AF\uFF0C\u8D27\u90CE\u4ECE\u6B64\u5168\u5E74\u5356\u5404\u5B63\u79CD\u5B50\u3002\u6C34\u8F66\u6BCF\u6668\u6D47\u704C\u7530\u5730\u6700\u4E1C\u8FB9\u516B\u5217\u3002","The greenhouse covers 24 plots in the northwest corner: any season\u2019s seeds grow there and nothing withers, and the peddler then sells every seed all year. The waterwheel waters the eight easternmost columns each morning."],["\u4E4C\u7BF7\u5C0F\u821F","The skiff","\u6CCA\u5728\u6C60\u5858\u897F\u5357\u5CB8\uFF0C\u8D70\u8FD1\u6309 E \u4E0A\u8239\uFF0C\u7167\u5E38\u79FB\u52A8\u5373\u662F\u5212\u8239\uFF0C\u56DE\u5230\u6CCA\u4F4D\u518D\u6309 E \u4E0B\u8239\u3002\u8239\u4E0A\u629B\u7AFF\uFF0C\u54AC\u94A9\u5FEB\u4E09\u6210\u3002\u590F\u3001\u79CB\u4E24\u5B63\u6BCF\u65E5\u6C34\u9762\u4E0A\u7ACB\u7740\u4E09\u679A\u83B2\u84EC\uFF0C\u8239\u9760\u8FD1\u5C31\u6458\u4E0B\uFF0C\u522B\u5904\u91C7\u4E0D\u5230\u3002\u8239\u4E0A\u7528\u4E0D\u4E86\u9504\u3001\u65A7\u7B49\u522B\u7684\u5BB6\u4EC0\u3002","Moored on the south-west bank of the pond. Walk up and press E to board, move as usual to row, and press E again back at the mooring to step ashore. Fish bite 30% sooner from the boat. In summer and autumn three lotus pods stand on the water each day: bring the boat close to gather them, for they grow nowhere else. Hoes, axes and other tools are no use aboard."],["\u679C\u56ED","Orchard","\u5C4B\u4E1C\u5317\u53EF\u683D\u516D\u68F5\u679C\u6811\uFF1A\u6787\u6777\u6625\u3001\u6843\u5B50\u590F\u3001\u67FF\u5B50\u79CB\u3001\u871C\u6A58\u51AC\u3002\u683D\u4E0B\u516B\u65E5\u957F\u6210\uFF0C\u6B64\u540E\u5F53\u5B63\u6BCF\u6668\u7ED3\u4E00\u679C\uFF0C\u6811\u4E0A\u81F3\u591A\u6512\u4E09\u679A\u3002","Six trees fit northeast of the house: loquat for spring, peach for summer, persimmon for autumn, mandarin for winter. They grow in eight days, then bear one fruit each morning in season, holding up to three."],["\u5C4B\u820D","The house","\u5206\u4E09\u7EA7\u6269\u5EFA\uFF1A\u4FEE\u847A\u5C4B\u820D\uFF08\u4F53\u529B\u4E0A\u9650 +20\uFF09\u3001\u6DFB\u5EFA\u53A2\u623F\uFF08\u884C\u56CA +8 \u683C\uFF09\u3001\u8D77\u9601\u697C\uFF08\u6536\u8D2D\u4EF7\u518D\u6DA8\u534A\u6210\uFF09\u3002\u4E94\u5343\u6587\u4EE5\u4E0A\u7684\u5927\u4EF6\u90FD\u8981\u70B9\u4E24\u6B21\u624D\u6210\u4EA4\u3002","Three stages: mending it (max stamina +20), a side wing (8 more bag slots) and a loft (the peddler pays 5% more). Anything costing 5,000 or more needs a second tap to confirm."],["\u4E61\u91CC\u516C\u76CA","Village works","\u5BB6\u4E1A\u9F50\u5907\u540E\uFF0C\u544A\u793A\u724C\u4E0A\u53EF\u6350\u5EFA\uFF1A\u8DEF\u706F\uFF08\u5165\u591C\u8D70\u8DEF\u5FEB\u4E00\u6210\uFF09\u3001\u6808\u6865\uFF08\u53EF\u8D70\u4E0A\u53BB\u5782\u9493\uFF0C\u54AC\u94A9\u5FEB\u4E24\u6210\uFF09\u3001\u620F\u53F0\uFF08\u8D5B\u4F1A\u5F69\u5934\u7FFB\u500D\uFF09\u3001\u724C\u574A\uFF08\u4E61\u90BB\u4EA4\u60C5\u6BCF\u65E5\u81EA\u6DA8\uFF09\u3002","When your own farm wants for nothing, the notice board lists works to fund: road lanterns (10% faster after dark), a pier you can fish from (bites 20% sooner), a stage (contest prizes doubled) and an archway (every bond grows a little each day)."]],folk:[["\u4E61\u5FD7","Village Chronicle","\u4E94\u7AE0\u957F\u7EBF\u76EE\u6807\uFF08\u7ACB\u8DB3\u3001\u5B89\u5BB6\u3001\u5174\u4E1A\u3001\u540D\u671B\u3001\u5F52\u56ED\uFF09\uFF0C\u5217\u5728\u884C\u56CA\u7684\u201C\u4E61\u5FD7\u201D\u9875\uFF0C\u201C\u519C\u4E8B\u201D\u91CC\u4E5F\u4F1A\u63D0\u793A\u4E0B\u4E00\u4EF6\u3002\u4E00\u7AE0\u529E\u5B8C\uFF0C\u4E61\u91CC\u6765\u4FE1\u9053\u8D3A\u5E76\u9644\u793C\u3002","Five chapters of long-term goals (Taking Root, Settling In, Growing the Farm, A Name in the Valley, The Garden Home), listed on the bag\u2019s Chronicle page and hinted at in the to-do list. Finish a chapter and the village writes with a gift."],["\u9001\u793C\u4E0E\u4EA4\u60C5","Gifts and bonds","\u8D27\u90CE\u3001\u753B\u5E08\u3001\u6E14\u7FC1\u3001\u7267\u7AE5\u6BCF\u65E5\u5404\u53EF\u6536\u4E00\u4EFD\u793C\u3002\u5404\u6709\u4E09\u6837\u6700\u7231\uFF0C\u9001\u5BF9\u4E86\u4EA4\u60C5\u6DA8\u5F97\u5FEB\uFF1B\u6BCF\u5347\u4E00\u7EA7\u5BF9\u65B9\u900F\u9732\u4E00\u6837\u6700\u7231\u3002\u8282\u65E5\u9001\u793C\u52A0\u500D\u3002","The peddler, painter, fisherman and herd boy each accept one gift a day. Each has three favorites that raise the bond fastest, and reveals one whenever the bond deepens. Gifts count double on festivals."],["\u4EA4\u60C5\u7684\u56DE\u62A5","What bonds bring","\u4EA4\u60C5\u5171\u56DB\u7EA7\uFF1A\u8D27\u90CE\u7684\u79CD\u5B50\u6BCF\u7EA7\u4FBF\u5B9C 5%\uFF0C\u753B\u5E08\u8BA9\u544A\u793A\u8D4F\u94B1\u6BCF\u7EA7\u591A 5%\uFF0C\u6E14\u7FC1\u6BCF\u6668\u9001\u9C7C\u9975\u3001\u629B\u7AFF\u66F4\u7701\u529B\uFF0C\u7267\u7AE5\u6BCF\u6668\u66FF\u4F60\u6D47\u51E0\u683C\u7530\u3002\u5230\u201C\u53CB\u4EBA\u201D\u65F6\u524D\u4E09\u4F4D\u5404\u6559\u4E00\u9053\u83DC\u3002","Four levels: the peddler takes 5% off seeds per level, the painter makes notices pay 5% more per level, the fisherman sends bait each morning and eases your cast, the herd boy waters a few plots each morning. At the second level the first three each teach you a dish."],["\u5FC3\u613F\u4E0E\u4FE1\u7269","Requests and keepsakes","\u6BCF\u4F4D\u4E61\u90BB\u6709\u4E09\u6869\u5FC3\u613F\uFF0C\u4EA4\u60C5\u6BCF\u6DF1\u4E00\u7EA7\u63D0\u51FA\u4E00\u6869\u3002\u529E\u6210\u5F97\u8C22\u793C\u4E0E\u4E00\u4EF6\u4FE1\u7269\uFF0C\u7B2C\u4E09\u6869\u53E6\u6709\u957F\u4E45\u7684\u597D\u5904\u3002","Each neighbor has three requests, one per bond level. Fulfilling one earns a reward and a keepsake, and the third brings a lasting benefit."],["\u753B\u5E08","The painter","\u4EAD\u897F\u7684\u753B\u5E08\u5728\u753B\u56DB\u65F6\u753B\u5377\uFF0C\u6BCF\u5B63\u8981\u4E09\u6837\u5F53\u5B63\u98CE\u7269\u3002\u56DB\u5E45\u753B\u6210\uFF0C\u8D27\u90CE\u7684\u6536\u8D2D\u4EF7\u6C38\u4E45\u4E0A\u6DA8\u4E00\u6210\u3002\u6B64\u540E\u4ED6\u53C8\u8D77\u4E00\u672C\u8349\u866B\u518C\u9875\uFF0C\u56DB\u5F00\u753B\u5B8C\uFF0C\u6BCF\u5B63\u521D\u634E\u6765\u4E00\u7B14\u6DA6\u683C\u3002","West of the pavilion, the painter is making a scroll of the four seasons and needs three seasonal things for each panel. Finish all four and the peddler pays 10% more for good. He then begins an album of small creatures; finish its four leaves and he sends you a fee at the start of every season."],["\u7267\u7AE5","The herd boy","\u767D\u5929\u6CBF\u5927\u8DEF\u8D70\u52A8\uFF0C\u96E8\u5929\u548C\u591C\u91CC\u4E0D\u51FA\u95E8\uFF0C\u7231\u5403\u751C\u7684\u3002\u6625\u5929\u4ED6\u653E\u98CE\u7B5D\uFF1B\u79CB\u5929\u5E26\u7740\u87CB\u87C0\u53BB\u627E\u4ED6\uFF0C\u80FD\u6597\u4E00\u573A\u87CB\u87C0\uFF08\u4E00\u65E5\u4E00\u56DE\uFF09\u3002","He roams the main road by day, stays home in rain and after dark, and has a sweet tooth. He flies a kite in spring; in autumn, bring a cricket and he will pit his own against it (once a day)."],["\u884C\u5546","The traveling trader","\u6BCF\u5B63\u7B2C 4\u300110 \u65E5\u505C\u5728\u6751\u897F\u8DEF\u53E3\uFF1A\u5356\u4EBA\u53C2\u4E0E\u7261\u4E39\u7684\u79CD\u5B50\uFF08\u522B\u5904\u4E70\u4E0D\u5230\uFF09\u3001\u798F\u888B\uFF0C\u5E76\u9AD8\u4EF7\u6536\u8D2D\u4E00\u79CD\u5F53\u5B63\u8D27\u7269\u3002","On the 4th and 10th of each season he stops at the west road, selling ginseng and peony seeds (found nowhere else) and lucky pouches, and paying a premium for one seasonal product."],["\u8282\u65E5","Festivals","\u6BCF\u5B63\u7B2C\u4E03\u65E5\uFF08\u6625\u793E\u3001\u7AEF\u5348\u3001\u4E2D\u79CB\u3001\u51AC\u81F3\uFF09\uFF1A\u6E05\u6668\u6709\u8282\u793C\uFF1B\u767D\u5929\u4EAD\u5B50\u91CC\u6709\u8D5B\u4F1A\uFF0C\u62FF\u4E00\u6837\u4E1C\u897F\u53C2\u8BC4\uFF0C\u6309\u8D27\u90CE\u4F30\u4EF7\u5206\u4E09\u7B49\u5F97\u5F69\u5934\uFF1B\u5165\u591C\u53EF\u653E\u4E00\u76CF\u5929\u706F\uFF0C\u4E09\u4E2A\u5FC3\u613F\u9009\u4E00\u4E2A\u3002\u6709\u4E86\u5C0F\u821F\uFF0C\u7AEF\u5348\u5F53\u65E5\u6C60\u4E0A\u8FD8\u6709\u7ADE\u6E21\uFF1A\u4E0A\u8239\u540E\u7ED5\u904D\u4E09\u9762\u7EA2\u65D7\u518D\u56DE\u6CCA\u4F4D\uFF0C\u6309\u7528\u65F6\u5206\u4E09\u7B49\u5F97\u5F69\u5934\uFF08\u6BCF\u4E2A\u7AEF\u5348\u53EA\u9886\u5934\u4E00\u8D9F\u7684\uFF09\u3002","The 7th of each season (Spring Fair, Dragon Boat, Mid-Autumn, Winter Solstice): a gift in the morning; a contest at the pavilion by day, where one entry is judged by the peddler\u2019s valuation for a prize; and after dusk a sky lantern, with one of three wishes. With a skiff, the Dragon Boat Festival also brings a race on the pond: board, round the three red flags and return to the mooring; your time decides the prize (paid for the first run of the day only)."],["\u4FE1\u7BB1","The mailbox","\u5C4B\u524D\u4FE1\u7BB1\u7AD6\u7740\u7EA2\u65D7\u5C31\u662F\u6709\u4FE1\uFF1A\u4E61\u90BB\u7684\u8C22\u793C\u3001\u8282\u65E5\u524D\u4E00\u5929\u7684\u5E16\u5B50\u3001\u4E61\u5FD7\u7684\u8D3A\u4FE1\u3001\u65B0\u5E74\u7684\u8D3A\u5C81\u94B1\u3002","A red flag on the mailbox by your door means mail: thanks from neighbors, a notice the day before each festival, Chronicle letters, and the village\u2019s New Year gift."],["\u963F\u9EC4","Huang the dog","\u4E00\u8DEF\u8DDF\u7740\u4F60\u3002\u6BCF\u5929\u5934\u4E00\u56DE\u6478\u6478\u5B83\u56DE 10 \u70B9\u4F53\u529B\uFF1B\u6478\u719F\u4E86\uFF08\u4E94\u5929\u4EE5\u4E0A\uFF09\uFF0C\u6E05\u6668\u5076\u5C14\u4F1A\u53FC\u56DE\u4E00\u6837\u91CE\u7269\u3002","He follows you everywhere. The first pat each day restores 10 stamina; once he knows you well (five days of pats), he sometimes brings home a wild find in the morning."],["\u5C81\u672B\u5C0F\u7ED3","Year in review","\u6BCF\u8FC7\u5B8C\u4E00\u5E74\uFF0C\u65B0\u5E74\u6E05\u6668\u6E05\u70B9\u53BB\u5E74\uFF0C\u6309\u8FDB\u8D26\u8BC4\u4E2A\u540D\u5934\uFF08\u4F43\u6237\u3001\u81EA\u8015\u519C\u3001\u6BB7\u5B9E\u4EBA\u5BB6\u3001\u4E00\u65B9\u4E61\u7EC5\uFF09\uFF0C\u8BB0\u5728\u884C\u56CA\u7684\u8D26\u672C\u91CC\u3002","After each full year, New Year\u2019s morning reviews the year and gives you a title by earnings (Tenant Farmer, Smallholder, Prosperous Household, Village Squire), kept in the ledger in your bag."]]};var ze=i=>document.getElementById(i),Pb=["\u4E00","\u4E8C","\u4E09","\u56DB","\u4E94","\u516D","\u4E03","\u516B","\u4E5D","\u5341","\u5341\u4E00","\u5341\u4E8C"],Qt=i=>p(`${i} \u6587`,`${i} coins`);function sn(i){let e=ee[i];return`<div class="icon ${e.type}" style="--c:${e.color}">${e.glyph}</div>`}function xp(i,e,t){let n=i.getContext("2d"),r=i.width,s=i.height,a=t?1:.16,o=23+e*131,l=()=>(o=o*16807%2147483647)/2147483647;n.globalAlpha=1,n.fillStyle="#f2ead7",n.fillRect(0,0,r,s),n.globalAlpha=a,n.fillStyle=e===3?"#cfc9bb":"#b9412f",n.beginPath(),n.arc(r*(e%2?.28:.7),s*.17,r*.085,0,6.3),n.fill();let c=[["#a9b6b0","#7f978a","#56705f"],["#9db5a4","#6f927e","#3f6f52"],["#d2b295","#b08060","#8
